name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl \
            device-tree-compiler flex gcc g++ git \
            libelf-dev libncurses-dev libssl-dev \
            lz4 make pahole perl python3 \
            rsync unzip wget zip zstd

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Bosyaf/bb
          ref: main
          path: kernel_source
          fetch-depth: 1

      - name: Restore Clang Cache
        uses: actions/cache@v4
        with:
          path: toolchains/clang-1
          key: aosp-clang-r487747c-linux-x86-64-v1

      - name: Build Kernel
        working-directory: kernel_source
        run: |
          chmod +x build_kernel.sh
          bash -n build_kernel.sh
          ./build_kernel.sh

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RealKing-Peridot-Kernel
          path: kernel_source/RealKing-Peridot-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
