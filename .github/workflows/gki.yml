name: Test Clang Download

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download Clang
        shell: bash
        run: |
          set -euo pipefail

          URL="https://kota.klozz.dev/downloads/Yuki-Clang-24.0.0-20261113.tar.zst"
          FILE="$RUNNER_TEMP/clang.tar.zst"
          HEADERS="$RUNNER_TEMP/headers.txt"

          echo "Starting download"

          if curl -fL \
            --connect-timeout 30 \
            --max-time 900 \
            -D "$HEADERS" \
            -o "$FILE" \
            "$URL"; then
            echo "DOWNLOAD SUCCESS"
          else
            echo "DOWNLOAD FAILED"
            cat "$HEADERS" || true
            exit 1
          fi

          echo "Response headers"
          cat "$HEADERS"

          echo "Downloaded file"
          ls -lh "$FILE"
          file "$FILE"

          echo "Checking archive"
          zstd -t "$FILE"
          tar --zstd -tf "$FILE" > "$RUNNER_TEMP/contents.txt"
          head -n 20 "$RUNNER_TEMP/contents.txt"

          echo "SUCCESS - Download and archive checks passed"
