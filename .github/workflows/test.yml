name: Pure E-Sports Kernel (LTS + Oplus)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      KBUILD_BUILD_USER: "boss"
      KBUILD_BUILD_HOST: "yaf"
      NCPU: "2"

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 24

      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. Paketler ve Neutron Clang Kurulumu
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils \
            rsync unzip dwarves bc cpio wget xz-utils make gcc-aarch64-linux-gnu \
            pkg-config zstd
          echo "🔥 AntMan kullanılarak en son Neutron Clang çekiliyor..."
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: 2. Kaynakları Çek
        run: |
          git clone https://github.com/Bosyaf/AnyKernel3.git --depth 1 AnyKernel3
          
          # Az önce yamaları başarıyla gönderdiğin kendi LTS reponu çekiyoruz:
          git clone --depth=1 https://github.com/Bosyaf/Lts.git common

      - name: 3. E-Spor Config'lerini Enjekte Et ve Yapılandır
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          
          mkdir -p out
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          echo "⚙️ Sched_Ext, BPF, BTF ve Oplus modülleri aktif ediliyor..."
          echo "CONFIG_SLIM_SCHED=y" >> $DEFCONFIG
          echo "CONFIG_OPLUS_SYSTEM_KERNEL_QCOM=y" >> $DEFCONFIG
          echo "CONFIG_BPF=y" >> $DEFCONFIG
          echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG
          echo "CONFIG_BPF_JIT=y" >> $DEFCONFIG
          echo "CONFIG_CGROUP_BPF=y" >> $DEFCONFIG
          echo "CONFIG_DEBUG_INFO_BTF=y" >> $DEFCONFIG
          echo "CONFIG_DMABUF_HEAPS=y" >> $DEFCONFIG
          echo "CONFIG_NET_XGRESS=y" >> $DEFCONFIG
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            gki_defconfig

      - name: 4. Kernel Derleme
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          BUILD_START=$(date +%s)
          
          echo "🔥 Kernel derlemesi başlıyor..."
          make -j$NCPU O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            Image || { echo "❌ Image derleme HATASI!"; exit 1; }
           
          IMAGE_TIME=$(($(date +%s) - BUILD_START))
          echo "✅ Image derleme süresi: $((IMAGE_TIME/60)) dakika $((IMAGE_TIME%60)) saniye"
          echo "BOOTHASH=PureEsports-$(date +%s%N | cut -c1-10)" >> $GITHUB_ENV

      - name: 5. AnyKernel3 Paketleme
        run: |
          cd ./AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Pure E-Sports Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' anykernel.sh
          sed -i '/is_slot_device=auto/a device.name1=houji\ndevice.name2=shennong\ndevice.name3=aurora\ndevice.name4=xiaomi14' anykernel.sh
          
          cp ../common/out/arch/arm64/boot/Image .
          zip -r -q "../Pure-Esports-Kernel.zip" ./*
          echo "📦 Paket hazır: Pure-Esports-Kernel.zip"

      - name: 6. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "Pure E-Sports Kernel"
          files: "Pure-Esports-Kernel.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
