name: Bosyaf (lote5_workqueue.patch)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. Paketler ve Neutron Clang (AntMan) Kurulumu
        run: |
          set -e

          sudo apt update -qq

          sudo apt install -y --no-install-recommends \
            python3 \
            git \
            curl \
            libelf-dev \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            liblz4-tool \
            zlib1g-dev \
            libxml2-utils \
            rsync \
            unzip \
            dwarves \
            bc \
            cpio \
            wget \
            xz-utils \
            make \
            gcc-aarch64-linux-gnu \
            pkg-config \
            zstd

          echo "🔥 AntMan kullanılarak en son Neutron Clang çekiliyor..."

          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fLo antman \
            "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"

          chmod +x antman

          ./antman -S

          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

          echo "✅ Neutron Clang indirildi ve PATH'e eklendi."

          echo "🔎 Toolchain kontrol:"
          clang --version
          ld.lld --version

      - name: 2. Kaynakları Çek
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/Bosyaf/AnyKernel3.git \
            AnyKernel3

          git clone --depth=1 https://github.com/Bosyaf/custom.git common

          echo "✅ Kernel source hazır."
          echo "📁 Branch:"
          cd common
          git branch --show-current
          git log -1 --oneline

      - name: 3. Full Kernel Config & ZRAM Hazırlığı
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/common"

          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          echo "============================================================"
          echo "🔧 KERNEL HAZIRLIĞI"
          echo "============================================================"

          sed -i 's/^PHONY += all/  /g' Makefile || true

          touch .scmversion

          cat << 'EOF' > scripts/check-local-export
          #!/bin/sh
          exit 0
          EOF

          chmod +x scripts/check-local-export
          chmod +x scripts/config || true

          mkdir -p out

          # --------------------------------------------------------
          # modulelist.sh
          # --------------------------------------------------------

          MODULELIST="$GITHUB_WORKSPACE/sh/modulelist.sh"

          echo ""
          echo "============================================================"
          echo "🔧 modulelist.sh KONTROLÜ"
          echo "============================================================"

          if [ ! -f "$MODULELIST" ]; then
            echo "❌ HATA: modulelist.sh bulunamadı!"
            echo "📁 Aranan dosya: $MODULELIST"
            exit 1
          fi

          chmod +x "$MODULELIST"

          echo "✅ modulelist.sh bulundu."
          echo "▶️ Çalıştırılıyor..."

          bash "$MODULELIST" "$GITHUB_WORKSPACE/common"

          echo "✅ modulelist.sh başarıyla tamamlandı."

          # --------------------------------------------------------
          # İlk defconfig
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "🔧 GKI DEFCONFIG"
          echo "============================================================"

          make O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="clang" \
            LD="ld.lld" \
            HOSTCC="clang" \
            HOSTCXX="clang++" \
            HOSTLD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            gki_defconfig

          CONFIG_FILE="$GITHUB_WORKSPACE/common/out/.config"

          echo "✅ Defconfig oluşturuldu:"
          echo "$CONFIG_FILE"

          # --------------------------------------------------------
          # ZRAM
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "🧠 ZRAM CONFIG"
          echo "============================================================"

          # Swap altyapısı
          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_SWAP

          # ZSMALLOC built-in
          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_ZSMALLOC

          # ZRAM built-in
          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_BLK_DEV_ZRAM

          # Eğer source CONFIG_ZRAM kullanıyorsa onu da aç
          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_ZRAM || true

          # LZ4 default
          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_ZRAM_DEF_COMP_LZ4

          ./scripts/config --file "$CONFIG_FILE" \
            --disable CONFIG_ZRAM_DEF_COMP_LZORLE || true

          ./scripts/config --file "$CONFIG_FILE" \
            --disable CONFIG_ZRAM_DEF_COMP_LZO || true

          ./scripts/config --file "$CONFIG_FILE" \
            --disable CONFIG_ZRAM_DEF_COMP_ZSTD || true

          ./scripts/config --file "$CONFIG_FILE" \
            --set-str CONFIG_ZRAM_DEF_COMP "lz4"

          # ZRAM özellikleri
          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_ZRAM_WRITEBACK

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_ZRAM_MEMORY_TRACKING

          # --------------------------------------------------------
          # LZ4 / LZO / ZSTD compressor desteği
          # --------------------------------------------------------

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_LZ4_COMPRESS

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_LZ4HC_COMPRESS

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_LZ4_DECOMPRESS

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_LZO_COMPRESS

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_LZO_DECOMPRESS

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_ZSTD_COMMON

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_ZSTD_COMPRESS

          ./scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_ZSTD_DECOMPRESS

          # --------------------------------------------------------
          # Localversion
          # --------------------------------------------------------

          ./scripts/config --file "$CONFIG_FILE" \
            --set-str CONFIG_LOCALVERSION "-Nimrodel"

          ./scripts/config --file "$CONFIG_FILE" \
            --disable CONFIG_LOCALVERSION_AUTO

          # check_defconfig kaldır
          sed -i 's/check_defconfig//' build.config.gki || true

          # --------------------------------------------------------
          # Final config
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "🔄 OLDDEFCONFIG"
          echo "============================================================"

          make O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="clang" \
            LD="ld.lld" \
            HOSTCC="clang" \
            HOSTCXX="clang++" \
            HOSTLD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            olddefconfig

          # --------------------------------------------------------
          # ZRAM FINAL CONFIG LOG
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "🔎 FINAL ZRAM CONFIG"
          echo "============================================================"

          grep -E \
            '^CONFIG_(SWAP|BLK_DEV_ZRAM|ZRAM|ZSMALLOC|ZRAM_DEF_COMP|LZ4_COMPRESS|LZ4HC_COMPRESS|LZ4_DECOMPRESS|LZO_COMPRESS|LZO_DECOMPRESS|ZSTD_COMMON|ZSTD_COMPRESS|ZSTD_DECOMPRESS)' \
            "$CONFIG_FILE" || true

          echo ""
          echo "============================================================"
          echo "📦 ZRAM MODULE LIST KONTROLÜ"
          echo "============================================================"

          if grep -RniE 'zram\.ko|zsmalloc\.ko' \
            modules.bzl \
            android/abi_gki_aarch64_xiaomi \
            2>/dev/null; then

            echo "⚠️ UYARI: zram.ko veya zsmalloc.ko hâlâ listede!"
          else
            echo "✅ zram.ko / zsmalloc.ko module listlerinde yok."
          fi

      - name: 4. Kernel Derleme
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/common"

          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          echo "============================================================"
          echo "🚀 KERNEL DERLEME"
          echo "============================================================"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" \
            LD="ld.lld" \
            HOSTCC="clang" \
            HOSTCXX="clang++" \
            HOSTLD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            KCFLAGS="-O2 -Wno-frame-larger-than" \
            Image

          echo "✅ Kernel Image başarıyla derlendi."

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Image bulunamadı!"
            exit 1
          fi

          echo "📦 Image boyutu:"
          du -h out/arch/arm64/boot/Image

          echo "BOOTHASH=Bosyaf-$(date +%s%N | cut -c1-10)" >> "$GITHUB_ENV"

      - name: 5. AnyKernel3 Paketleme
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/AnyKernel3"

          sed -i \
            's/kernel.string=.*/kernel.string=CG+ Galadriel Kernel/' \
            anykernel.sh

          sed -i \
            's/do.devicecheck=1/do.devicecheck=0/' \
            anykernel.sh

          sed -i \
            's/is_slot_device=0/is_slot_device=auto/' \
            anykernel.sh

          sed -i \
            '/is_slot_device=auto/a device.name1=houji\ndevice.name2=shennong\ndevice.name3=aurora\ndevice.name4=xiaomi14' \
            anykernel.sh

          cp \
            "$GITHUB_WORKSPACE/common/out/arch/arm64/boot/Image" \
            .

          zip -r "../CG-Galadriel.zip" ./*

          echo "📦 Paket boyutu:"
          du -h "../CG-Galadriel.zip"

      - name: 6. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "CG+ Galadriel (Neutron Clang)"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
