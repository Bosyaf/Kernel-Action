name: Bosyaf (patch denemeleri )

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 24

      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. Paketler ve AOSP Clang Kurulumu
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils \
            rsync unzip dwarves bc cpio wget xz-utils make gcc-aarch64-linux-gnu \
            pkg-config zstd
            
          echo "🔥 GitLab üzerinden AOSP Clang 17 çekiliyor..."
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          
          # GitLab'dan zip'i indiriyoruz
          wget -qO aosp-clang.zip "https://gitlab.com/anandhan07/aosp-clang/-/archive/17/aosp-clang-17.zip?ref_type=heads"
          
          # Zip'i çıkartıp klasör adını sabitliyoruz
          unzip -q aosp-clang.zip
          mv aosp-clang-17 aosp-clang
          rm aosp-clang.zip
          
          # PATH'e ekliyoruz
          echo "$HOME/toolchains/aosp-clang/bin" >> "$GITHUB_PATH"
          echo "✅ AOSP Clang İndirildi ve PATH'e eklendi!"
  
      - name: 2. Kaynakları Çek
        run: |
          git clone https://github.com/Bosyaf/AnyKernel3.git --depth 1 AnyKernel3
          git clone --depth=1 https://github.com/Bosyaf/samx_kernel_peridot.git common
               
      - name: 3. Full Kernel Config & Derleme Hazırlığı
        run: |
          cd common
          # Yeni Clang dizinini kullanıyoruz
          export PATH="$HOME/toolchains/aosp-clang/bin:$PATH"
        
          sed -i 's/^PHONY += all/  /g' Makefile || true
          touch .scmversion
          cat << 'EOF' > scripts/check-local-export
          #!/bin/sh
          exit 0
          EOF
          chmod -R +x scripts/
          mkdir -p out
          [ -x ./scripts/config ] || chmod +x ./scripts/config || true
          # ============================================================
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            gki_defconfig
          CONFIG_FILE="out/.config"
          
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_SWAP
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_ZSWAP
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_ZSMALLOC
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_ZSMALLOC_STAT

          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_ZRAM
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_ZRAM_DEF_COMP_LZORLE
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_ZRAM_DEF_COMP_ZSTD
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_ZRAM_DEF_COMP_LZ4
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_ZRAM_DEF_COMP_LZO
          ./scripts/config --file "$CONFIG_FILE" --set-str CONFIG_ZRAM_DEF_COMP "lzo-rle"
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_ZRAM_WRITEBACK
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_ZRAM_MEMORY_TRACKING

          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_CRYPTO_LZO
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_CRYPTO_LZ4
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_CRYPTO_LZ4HC
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_CRYPTO_ZSTD
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_CRYPTO_DEFLATE
                
          # ==========================================================
          # Localversion
          ./scripts/config --file $CONFIG_FILE --set-str CONFIG_LOCALVERSION "-Nimrodel"
          ./scripts/config --file $CONFIG_FILE --disable CONFIG_LOCALVERSION_AUTO
          sed -i 's/check_defconfig//' build.config.gki || true
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            olddefconfig
            
      - name: 4. Kernel Derleme
        run: |
          cd common
          # Yeni Clang dizinini kullanıyoruz
          export PATH="$HOME/toolchains/aosp-clang/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            Image || { echo "❌ Derleme HATASI!"; exit 1; }
          echo "BOOTHASH=Bosyaf-$(date +%s%N | cut -c1-10)" >> $GITHUB_ENV
          
      - name: 5. AnyKernel3 Paketleme
        run: |
          cd ./AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=CG+ Galadriel Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' anykernel.sh
          sed -i '/is_slot_device=auto/a device.name1=houji\ndevice.name2=shennong\ndevice.name3=aurora\ndevice.name4=xiaomi14' anykernel.sh
          cp ../common/out/arch/arm64/boot/Image .
          zip -r "../CG-Galadriel.zip" ./*
          echo "📦 Paket boyutu: $(du -h ../CG-Galadriel.zip | cut -f1)"
          
      - name: 6. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "CG+ Galadriel (AOSP Clang)"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
