name: CG+ Nimrodel (OnePlus 12)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      KBUILD_BUILD_USER: "boss"
      KBUILD_BUILD_HOST: "yaf"

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 24

      - name: Checkout
        uses: actions/checkout@v4

      # =================================================================
      # 1. ORTAM HAZIRLIĞI VE DERLEYİCİ
      # =================================================================
      - name: 1. Paketler ve ZyC Clang Çekimi
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils \
            rsync unzip dwarves bc cpio wget xz-utils make gcc-aarch64-linux-gnu \
            pkg-config zstd
          echo "🔥 Kusursuz Denge: ZyC Clang 22"
          CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz"
          curl -fLSs "$CLANG_URL" -o clang.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/clang-zyc"
          tar -xzf clang.tar.gz -C "$GITHUB_WORKSPACE/clang-zyc"
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang-zyc/bin" >> "$GITHUB_PATH"

      # =================================================================
      # 2. KAYNAK REPO (ONEPLUS 12)
      # =================================================================
      - name: 2. Kaynakları Çek
        run: |
          git clone https://github.com/Bosyaf/AnyKernel3.git --depth 1 AnyKernel3
          git clone --depth=1 https://github.com/Bosyaf/6.1.138.git common
      # =================================================================
      # 2. KERNELSU-NEXT, MULTI-MANAGER & SUSFS4KSU
      # =================================================================
      - name: 3. KernelSU-Next & SUSFS Entegrasyonu
        run: |
          cd common
          # KSU-Next Kurulum
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs > /dev/null 2>&1
          
          # Multi-Manager Patch
          cd KernelSU-Next
          PATCH="$GITHUB_WORKSPACE/patches/ksu/ksun-add-more-managers-support.patch"
          if [ -f "$PATCH" ]; then patch -p1 --forward < "$PATCH" > /dev/null 2>&1 || true; fi
          cd ..
          
          # SUSFS4KSU Kurulum ve Kopyalama
          git clone --depth=1 -q https://gitlab.com/pershoot/susfs4ksu -b gki-android14-6.1-dev susfs4ksu
          cp -R susfs4ksu/kernel_patches/fs/* ./fs/
          cp -R susfs4ksu/kernel_patches/include/* ./include/
          
          # SUSFS Yama Uygulamaları
          SUSFS_PATCH=$(ls susfs4ksu/kernel_patches/50_add_susfs*.patch 2>/dev/null | head -1)
          if [ -n "$SUSFS_PATCH" ]; then patch -p1 < "$SUSFS_PATCH" > /dev/null 2>&1 || true; fi
          
          wget -q "https://raw.githubusercontent.com/Bosyaf/Kernel-Action/main/fs_namespace.patch" -O fs_namespace.patch
          if [ -f fs_namespace.patch ]; then patch -p1 < fs_namespace.patch > /dev/null 2>&1 || true; fi
          rm -f fs_namespace.patch
          
          # SUSFS Canlı Yamalar
          sed -i 's/return (base->d_inode->i_mapping->flags & BIT_ANDROID_DATA_ROOT_DIR);/return (base \&\& !IS_ERR(base) \&\& base->d_inode \&\& (base->d_inode->i_mapping->flags \& BIT_ANDROID_DATA_ROOT_DIR));/g' fs/susfs.c
          sed -i 's/return (base->d_inode->i_mapping->flags & BIT_ANDROID_SDCARD_ROOT_DIR);/return (base \&\& !IS_ERR(base) \&\& base->d_inode \&\& (base->d_inode->i_mapping->flags \& BIT_ANDROID_SDCARD_ROOT_DIR));/g' fs/susfs.c
          find . -name "*.rej" -delete 2>/dev/null || true
          echo "✅ KernelSU ve SUSFS işlemleri tamamlandı!"
      # =================================================================
      # 3. STANDART YAMALAR VE GÜVENLİK
      # =================================================================
      - name: 4. Standart Yamalar (hjpatches)
        run: |
          cd common
          PATCH_DIR="../hjpatches"
          echo "🚀 Standart Yamalar Uygulanıyor..."
          
          for patch_file in $(ls "$PATCH_DIR"/*.patch | sort); do
            filename=$(basename "$patch_file")
            set +e 
            patch -p1 --fuzz=0 < "$patch_file" > patch_log.txt 2>&1
            PATCH_STATUS=$?
            set -e 
            
            if [ $PATCH_STATUS -eq 0 ]; then
              echo "  ✅ $filename"
            else
              echo "  ❌ $filename UYGULANAMADI! Hata logu:"
              cat patch_log.txt
            fi
            rm -f patch_log.txt
          done
      # =================================================================
      # 5. KERNEL YAPILANDIRMASI (SADECE OPLUS UAG)
      # =================================================================
      - name: 5. Kernel Config ve Export Temizliği
        run: |
          cd common
          export PATH="$GITHUB_WORKSPACE/clang-zyc/bin:$PATH"
              
          mkdir -p out
          [ -x ./scripts/config ] || chmod +x ./scripts/config || true
          
          # Base defconfig oluştur (Temiz başlangıç)
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            gki_defconfig
            
          CONFIG_FILE="out/.config"
          
          # ---> SADECE İSTENEN TEK ÖZELLİK <---
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_SCHED_BORE
          
          # Config dosyasını kaydet
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            olddefconfig

      # =================================================================
      # 6. DERLEME (SIFIR RİSK, SADECE HATA YOKSAYICI FLAG'LER)
      # =================================================================
      - name: 6. Kernel Derleme
        run: |
          cd common
          export PATH="$GITHUB_WORKSPACE/clang-zyc/bin:$PATH"
          
          # Hata vermemesi için KCFLAGS ve KLDFLAGS sadeleştirildi
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            KCFLAGS="-Wno-error -Wno-unused-command-line-argument -Wno-format -Wno-unused-variable" \
            KLDFLAGS="--as-needed" \
            Image || { echo "❌ Image derleme HATASI!"; exit 1; }
            
          echo "BOOTHASH=Nimrodel-$(date +%s%N | cut -c1-10)" >> $GITHUB_ENV

      # =================================================================
      # 7. ANYKERNEL3 PAKETLEME
      # =================================================================
      - name: 7. AnyKernel3 Paketleme (OnePlus)
        run: |
          cd ./AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=CG+ Nimrodel (OnePlus 12)/' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' anykernel.sh
          
          # Xiaomi kodları OnePlus 12 ile değiştirildi
          sed -i '/is_slot_device=auto/a device.name1=OnePlus12\ndevice.name2=cph2573\ndevice.name3=cph2581\ndevice.name4=pjd110\ndevice.name5=pjz110' anykernel.sh
          
          cp ../common/out/arch/arm64/boot/Image .
          zip -r -q "../Nimrodel.zip" ./*

      - name: 8. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "CG+ Nimrodel Kernel (OnePlus 12)"
          files: "Nimrodel.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
