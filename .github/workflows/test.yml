name: Bosyaf (mywork - Fast Check & CCache Build)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"
      CCACHE_DIR: "/home/runner/.ccache"
      CCACHE_MAXSIZE: "10G"
      CCACHE_COMPRESS: 1

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚀 1. Önbellek Kurulumu (Neutron Clang & CCache)
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/toolchains/neutron-clang
            /home/runner/.ccache
          key: build-cache-${{ runner.os }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: 2. Paketler, ccache ve Neutron Clang (AntMan) Kurulumu
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils \
            rsync unzip dwarves bc cpio wget xz-utils make gcc-aarch64-linux-gnu \
            pkg-config zstd ccache

          mkdir -p "$HOME/.ccache"
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          if [ ! -f "bin/clang" ]; then
            echo "🔥 Neutron Clang indiriliyor..."
            curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
            chmod +x antman
            ./antman -S
            ./antman --patch=glibc || true
          else
            echo "⚡ Neutron Clang önbellekten yüklendi!"
          fi

          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          echo "✅ Toolchain ve CCache Hazır!"

      - name: 3. Kaynakları Çek
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth 1 AnyKernel3
          git clone --depth=1 https://github.com/Bosyaf/mywork.git common

      - name: 4. Full Kernel Config & Derleme Hazırlığı
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          
          # KSU sürücü kaydını temiz tut
          sed -i '/ksu/d' drivers/Kconfig 2>/dev/null || true
          sed -i '/ksu/d' drivers/Makefile 2>/dev/null || true
          
          sed -i 's/^PHONY += all/  /g' Makefile || true
          touch .scmversion
          cat << 'EOF' > scripts/check-local-export
          #!/bin/sh
          exit 0
          EOF
          chmod -R +x scripts/
          mkdir -p out
          [ -x ./scripts/config ] || chmod +x ./scripts/config || true

          # Defconfig Yükleme (houji_defconfig)
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" LD="ld.lld" HOSTCC="ccache clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            houji_defconfig

          CONFIG_FILE="out/.config"

          # Oplus Sched_EXT Şalterlerini Aç
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_SYSTEM_KERNEL_QCOM
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_FEATURE_SCHED_EXT

          # Localversion ve Olddefconfig
          ./scripts/config --file $CONFIG_FILE --set-str CONFIG_LOCALVERSION "-Maeglin"
          ./scripts/config --file $CONFIG_FILE --disable CONFIG_LOCALVERSION_AUTO
          sed -i 's/check_defconfig//' build.config.gki || true

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" LD="ld.lld" HOSTCC="ccache clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            olddefconfig

      - name: 🔍 5. (15 Saniyelik) Hızlı Oplus Modül Testi
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          echo "⚡ Oplus platform kodları 15 saniyelik hızlı teste tabi tutuluyor..."

          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" LD="ld.lld" HOSTCC="ccache clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            drivers/platform/oplus/ || { echo "❌ Oplus modüllerinde eksik header veya C hatası var!"; exit 1; }

          echo "✅ Oplus modül testi BAŞARILI! Tam derlemeye geçiliyor..."

      - name: 6. Kernel Derleme (Image)
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          BUILD_START=$(date +%s)

          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTCC="ccache clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            KCFLAGS="-O2 -Wno-frame-larger-than" \
            KLDFLAGS="-Wl,--gc-sections -Wl,--as-needed -Wl,--strip-debug -Wl,--icf=safe -Wl,--no-warnings -Wl,-O2" \
            Image || { echo "❌ Derleme HATASI!"; exit 1; }

          IMAGE_TIME=$(($(date +%s) - BUILD_START))
          echo "✅ Image derleme süresi: $((IMAGE_TIME/60)) dakika $((IMAGE_TIME%60)) saniye"
          echo "BOOTHASH=Maeglin-$(date +%s%N | cut -c1-10)" >> $GITHUB_ENV

      - name: 7. AnyKernel3 Paketleme
        run: |
          cd ./AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=CG+ Galadriel Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' anykernel.sh
          sed -i '/is_slot_device=auto/a device.name1=houji\ndevice.name2=shennong\ndevice.name3=aurora\ndevice.name4=xiaomi14' anykernel.sh
          cp ../common/out/arch/arm64/boot/Image .
          zip -r "../CG-Galadriel.zip" ./*
          echo "📦 Paket boyutu: $(du -h ../CG-Galadriel.zip | cut -f1)"

      - name: 8. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "CG+ Galadriel (Neutron Clang - Fast-Check)"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
