name: Bosyaf (cpufreq patch denemeleri)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. Paketler ve Neutron Clang (AntMan) Kurulumu
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils \
            rsync unzip dwarves bc cpio wget xz-utils make gcc-aarch64-linux-gnu \
            pkg-config zstd
          echo "🔥 AntMan kullanılarak en son Neutron Clang çekiliyor..."
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          echo "✅ Neutron Clang İndirildi ve PATH'e eklendi!"
  
      - name: 2. Kaynakları Çek
        run: |
          git clone https://github.com/Bosyaf/AnyKernel3.git --depth 1 AnyKernel3
          git clone --depth=1 https://github.com/Bosyaf/aosp.git common

      - name: 3. Full Kernel Config & Derleme Hazırlığı
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
        
          sed -i 's/^PHONY += all/  /g' Makefile || true
          touch .scmversion
          cat << 'EOF' > scripts/check-local-export
          #!/bin/sh
          exit 0
          EOF
          chmod -R +x scripts/
          mkdir -p out
          [ -x ./scripts/config ] || chmod +x ./scripts/config || true

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            peridot_defconfig
          CONFIG_FILE="out/.config"

          
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_CPU_FREQ_GOV_UAG
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_UAG_NONLINEAR_FREQ_CTL
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_UAG_USE_TL
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_UA_KERNEL_CPU_IOCTL
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_UAG_AMU_AWARE
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_MULTI_LV_TL
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_FEATURE_TOUCH_BOOST
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_UAG_SOFT_LIMIT
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_OPLUS_FEATURE_FRAME_BOOST
          
          ./scripts/config --file $CONFIG_FILE --set-str CONFIG_LOCALVERSION "-Nimrodel"
          ./scripts/config --file $CONFIG_FILE --disable CONFIG_LOCALVERSION_AUTO
          sed -i 's/check_defconfig//' build.config.gki || true
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            olddefconfig
            
      - name: 4. SADECE cpufreq Derleme Testi
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          echo "SADECE drivers/cpufreq KLASÖRÜ DERLENİYOR, LÜTFEN BEKLEYİN..."
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            KCFLAGS="-O2 \
            -march=armv9.2-a+crypto+crc+dotprod+rcpc+lse+sha3 \
            -falign-functions=32 \
            -fomit-frame-pointer \
            -ffunction-sections \
            -fdata-sections \
            -fstack-protector \
            -fno-unwind-tables \
            -fno-asynchronous-unwind-tables \
            -fno-math-errno \
            -Wno-unused-command-line-argument \
            -Wno-error \
            -Wno-format \
            -Wno-format-extra-args \
            -Wno-constant-logical-operand \
            -Wno-unused-variable \
            -Wno-address-of-packed-member" \
            KLDFLAGS="-Wl,--gc-sections \
            -Wl,--as-needed \
            -Wl,--strip-debug \
            -Wl,--icf=safe \
            -Wl,-O2" \
            drivers/cpufreq/ || { echo "❌ cpufreq derleme HATASI!"; exit 1; }
          
          echo "✅ cpufreq HATA VERMEDEN BAŞARIYLA DERLENDİ!"
          
