name: Bosyaf (lote5_workqueue.patch)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. Paketler ve Neutron Clang (AntMan) Kurulumu
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils \
            rsync unzip dwarves bc cpio wget xz-utils make gcc-aarch64-linux-gnu \
            pkg-config zstd
          echo "🔥 AntMan kullanılarak en son Neutron Clang çekiliyor..."
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          echo "✅ Neutron Clang İndirildi ve PATH'e eklendi!"
          
      - name: 2. Kaynakları Çek
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth 1 AnyKernel3
          git clone --depth=1 https://github.com/Bosyaf/myy.git common
      
     # =================================================================
      # 2. KERNEL YAPILANDIRMASI (SAF DEFCONFIG)
      # =================================================================
      - name: 3. Kernel Config
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          
          # Gerekli boş dosyaları oluştur (Hata vermemesi için)
          sed -i 's/^PHONY += all/  /g' Makefile || true
          touch .scmversion
          cat << 'EOF' > scripts/check-local-export
          #!/bin/sh
          exit 0
          EOF
          chmod -R +x scripts/
          mkdir -p out
          
          echo "🔧 shen_gki_defconfig uygulanıyor..."
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            shen_gki_defconfig
            
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            olddefconfig
            
      # =================================================================
      # 3. DERLEME VE PAKETLEME
      # =================================================================
            # =================================================================
      # 3. DERLEME VE PAKETLEME
      # =================================================================
      - name: 4. Kernel Derleme
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          
          echo "🔥 Derleme Başlıyor..."
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            KCFLAGS="-Wno-uninitialized-const-pointer -Wno-error" \
            Image modules || { echo "❌ Derleme HATASI!"; exit 1; }
            
          echo "BOOTHASH=Bosyaf-$(date +%s%N | cut -c1-10)" >> $GITHUB_ENV
          
      - name: 5. AnyKernel3 Paketleme
        run: |
          cd ./AnyKernel3
          
          echo "📦 Repondaki özel anykernel.sh kullanılıyor..."
          
          # 1. "DTBO istemiyorum" talebin: Scriptin sonundaki flash_dtbo satırını otomatik siliyoruz.
          sed -i '/flash_dtbo/d' anykernel.sh
          
          # 2. Ana kernel imajını kopyala
          cp ../common/out/arch/arm64/boot/Image .
          
          # 3. KRİTİK: Senin anykernel.sh dosyan "_modules" içindeki .ko dosyalarını arıyor.
          # Hata vermemesi ve vendor_dlkm'nin yamalanması için modülleri bulup içine atıyoruz.
          mkdir -p _modules
          find ../common/out/ -type f -name "*.ko" -exec cp {} _modules/ \;
          
          # 4. Paketi Zip'le
          zip -r "../Nimrodel.zip" ./*
          echo "📦 Paket boyutu: $(du -h ../Nimrodel.zip | cut -f1)"
          
      - name: 6. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "WildAngel Kernel (ZyC Clang)"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          
      - name: 6. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "CG+ Nimrodel (ZyC Clang Saf Derleme)"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
