name: Nimrodel Houji GKI

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: 1. Gerekli Paketleri Kur
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev \
            rsync unzip bc cpio wget xz-utils pkg-config zip
            
      - name: 2. Kendi Repondan Kaynak Kodunu Çek
        run: |
          echo "🚀 Bosyaf/my reposundan kaynak kod indiriliyor..."
          git clone https://github.com/Bosyaf/my.git --depth=1 kernel_workspace
          
      - name: 3. Çekirdeği Derle (Senin Kusursuz Scriptin)
        run: |
          cd kernel_workspace
          chmod +x build_kernel.sh
          
          echo "🔥 Derleme Başlıyor! (LTO Kapalı, Clang 17 Devrede)"
          ./build_kernel.sh
          
      - name: 4. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nimrodel-Houji-${{ github.run_id }}
          name: "CG+ Nimrodel Houji GKI Kernel"
          files: kernel_workspace/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
