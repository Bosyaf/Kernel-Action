name: Bosyaf (Neutron Clang + UAG)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. Paketler ve Neutron Clang Çekimi
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils \
            rsync unzip dwarves bc cpio wget xz-utils make gcc-aarch64-linux-gnu \
            pkg-config zstd
          echo "🔥 Neutron Clang indiriliyor..."
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          echo "✅ Neutron Clang İndirildi ve PATH'e eklendi!"
          
      - name: 2. Kaynakları Çek
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth 1 AnyKernel3
          git clone --depth=1 https://github.com/Bosyaf/my_kernel.git common

      - name: 3. Kconfig Path Düzeltme
        run: |
          cd common
          
          echo "=== Kconfig path düzeltme ==="
          
          # Ana Kconfig path düzelt
          sed -i 's|drivers/soc/oplus/cpu/|kernel/sched/oplus/|g' kernel/sched/oplus/Kconfig
          sed -i 's|\$(KCONFIG_EXT_PREFIX)||g' kernel/sched/oplus/Kconfig
          
          # Var olmayan Kconfig'leri yorum yap
          sed -i 's|source "kernel/sched/oplus/misc/sched_assist/Kconfig"|// source "kernel/sched/oplus/misc/sched_assist/Kconfig"|g' kernel/sched/oplus/Kconfig
          
          # UAG Kconfig built-in yap
          sed -i 's/tristate "uag cpufreq policy governor"/bool "uag cpufreq policy governor"/g' kernel/sched/oplus/uad/Kconfig
          sed -i 's/default n/default y/g' kernel/sched/oplus/uad/Kconfig
          
          # UAD Makefile built-in yap
          sed -i 's/obj-\$(CONFIG_OPLUS_CPU_FREQ_GOV_UAG)/obj-y/g' kernel/sched/oplus/uad/Makefile
          sed -i 's/cpufreq_uag-\$(CONFIG_UAG_NONLINEAR_FREQ_CTL)/cpufreq_uag-y/g' kernel/sched/oplus/uad/Makefile
          sed -i 's/cpufreq_uag-\$(CONFIG_OPLUS_UAG_AMU_AWARE)/cpufreq_uag-y/g' kernel/sched/oplus/uad/Makefile
          sed -i 's/cpufreq_uag-\$(CONFIG_OPLUS_FEATURE_TOUCH_BOOST)/cpufreq_uag-y/g' kernel/sched/oplus/uad/Makefile
          sed -i 's/obj-\$(CONFIG_UA_KERNEL_CPU_IOCTL)/obj-y/g' kernel/sched/oplus/uad/Makefile
          sed -i 's/ua_cpu_ioctl-\$(CONFIG_OPLUS_FEATURE_FRAME_BOOST)/ua_cpu_ioctl-y/g' kernel/sched/oplus/uad/Makefile
          
          # Ana kernel/sched/Kconfig'e source ekle
          if ! grep -q "kernel/sched/oplus/Kconfig" kernel/sched/Kconfig; then
            echo 'source "kernel/sched/oplus/Kconfig"' >> kernel/sched/Kconfig
          fi
          
          # Ana kernel/sched/Makefile'e obj-y ekle
          if ! grep -q "oplus/" kernel/sched/Makefile; then
            echo 'obj-y += oplus/' >> kernel/sched/Makefile
          fi
          
          echo "✅ Kconfig düzeltmeleri tamamlandı!"

      - name: 4. Defconfig Oluştur
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig
          CONFIG_FILE="out/.config"
          ./scripts/config --file out/.config --enable CONFIG_OPLUS_CPU_FREQ_GOV_UAG
          ./scripts/config --file out/.config --enable CONFIG_UA_KERNEL_CPU_IOCTL
          ./scripts/config --file out/.config --enable CONFIG_OPLUS_FEATURE_FRAME_BOOST
          ./scripts/config --file out/.config --enable CONFIG_OPLUS_FEATURE_SCHED_ASSIST
          ./scripts/config --file out/.config --enable CONFIG_OPLUS_FEATURE_OCH
          ./scripts/config --file out/.config --enable CONFIG_OPLUS_FEATURE_GKI_CPUFREQ_BOUNCING
          ./scripts/config --file out/.config --enable CONFIG_OPLUS_OMRG
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          
      - name: 5. Kernel Derleme (Full Image)
        run: |
          cd common
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: 6. AnyKernel3 ile Flaşlanabilir Zip Oluştur
        run: |
          if [ -f common/out/arch/arm64/boot/Image ]; then
            echo "✅ Image başarıyla derlendi. AnyKernel3 içine kopyalanıyor..."
            cp common/out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            rm -rf .git* README.md
            zip -r9 ../Bosyaf-Kernel.zip *
          else
            echo "❌ HATA: Image dosyası bulunamadı, derleme başarısız olmuş olabilir!"
            exit 1
          fi

      - name: 7. Kernel Zip Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Bosyaf-Kernel-Zip
          path: Bosyaf-Kernel.zip
