name: Cache Temizleyici

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub CLI ile Tüm Cache'leri Sil
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Depodaki tüm cache kayıtları aranıyor ve siliniyor..."
          
          # GitHub CLI kullanarak tüm cache'leri zorla siler
          gh cache delete --all
          
          echo "✅ Hafıza tamamen temizlendi!"
          
