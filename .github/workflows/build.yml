name: Houji GKI (build_kernel.sh)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: 1. Gerekli Paketleri Kur
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev \
            rsync unzip bc cpio wget xz-utils pkg-config zip
            
      - name: 2. Kaynak Kodunu Çek (CLO-ACK)
        run: |
          echo "🚀 Techpack Kaynağı İndiriliyor..."
          git clone https://github.com/Bosyaf/myy.git -b main --depth=1 kernel_workspace
      - name: 3. Scripti Houji'ye Uyarla (Cerrah Modu)
        run: |
          cd kernel_workspace
          
          echo "📦 Anykernel Cihaz Ayarlari Yapiliyor..."
          sed -i 's/kernel.string=.*/kernel.string=CG+ Houji GKI Kernel (KSU Next)/' anykernel/anykernel.sh
          sed -i 's/device.name3=/device.name3=houji/' anykernel/anykernel.sh
          sed -i 's/device.name4=/device.name4=shennong/' anykernel/anykernel.sh
          sed -i '/flash_dtbo/d' anykernel/anykernel.sh
          
          echo "🛠️ build_kernel.sh Otomatize Ediliyor..."
          
          # 1. PRELUDE CLANG ZORLA (satiri tamamen degistir)
          sed -i 's/clang_choice=.*/clang_choice=2/g' build_kernel.sh
          sed -i '/read -p.*clang_choice/d' build_kernel.sh
          
          # 2. CLANG_DIR duzelt
          sed -i 's|CLANG_DIR="\$MAIN/toolchains/clang-1"|CLANG_DIR="\$MAIN/toolchains/clang-17"|g' build_kernel.sh
          
          # 3. Zip ismi
          sed -i 's/RealKing-Peridot/CG-Houji-GKI/g' build_kernel.sh
          
          # 4. DTBO/DT atla
          sed -i 's/cp -v "\$ZIMAGE_DIR\/dtbo.img" "\$TEMP_ANY_KERNEL_DIR\/"/echo "DTBO atlandi"/g' build_kernel.sh
          sed -i 's/cp -v "\$ZIMAGE_DIR\/dt.img" "\$TEMP_ANY_KERNEL_DIR\/"/echo "DT atlandi"/g' build_kernel.sh
          
          # 5. Butun .ko dosyalarini al
          sed -i '/IMPORTANT_MODULES=(/,/done/d' build_kernel.sh
          sed -i 's/echo "Modules in _modules:"/find "\$MODULES_DIR\/lib\/modules" -type f -name "*.ko" -exec cp {} "\$TEMP_ANY_KERNEL_DIR\/_modules\/" \\;\n    echo "Modules in _modules:"/' build_kernel.sh
          
          # 6. Dogrulama
          echo "=== DOGRULAMA ==="
          grep "clang_choice" build_kernel.sh | head -3
          grep "CLANG_DIR" build_kernel.sh | head -1
          grep "KERNEL_DEFCONFIG" build_kernel.sh | head -1
          
          # 4. BUTUN .ko dosyalarini zip'e al
          sed -i '/IMPORTANT_MODULES=(/,/done/d' build_kernel.sh
          sed -i 's/echo "Modules in _modules:"/find "$MODULES_DIR\/lib\/modules" -type f -name "*.ko" -exec cp {} "$TEMP_ANY_KERNEL_DIR\/_modules\/" \\;\n    echo "Modules in _modules:"/' build_kernel.sh -type f -name "*.ko" -exec cp {} "$TEMP_ANY_KERNEL_DIR\/_modules\/" \\;\n    echo "Modules in _modules:"/' build_kernel.sh
      - name: 4. Çekirdeği Derle (build_kernel.sh)
        run: |
          cd kernel_workspace
          chmod +x build_kernel.sh
          
          echo "🔥 Derleme Başlıyor! (KernelSU-Next Otomatik Eklenecek)"
          ./build_kernel.sh
      - name: 5. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Houji-GKI-${{ github.run_id }}
          name: "CG+ Houji GKI Kernel"
          files: kernel_workspace/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
