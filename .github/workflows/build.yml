name: BORE 6.8.0 Patch Test

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  test-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =================================================================
      # 1. ORTAM HAZIRLIĞI VE DERLEYİCİ
      # =================================================================
      - name: 1. Paketler ve ZyC Clang Çekimi
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils \
            rsync unzip dwarves bc cpio wget xz-utils make gcc-aarch64-linux-gnu \
            pkg-config zstd
          
          echo "ZyC Clang 22 indiriliyor..."
          CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz"
          curl -fLSs "$CLANG_URL" -o clang.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/clang-zyc"
          tar -xzf clang.tar.gz -C "$GITHUB_WORKSPACE/clang-zyc"
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang-zyc/bin" >> "$GITHUB_PATH"

      - name: 2. Kernel Kaynağını Çek
        run: |
          git clone --depth=1 https://github.com/Bosyaf/my_aosp.git common

      # =================================================================
      # 2. İZOLE TEST: SADECE YENİ BORE YAMASI (6.8.0)
      # =================================================================
      - name: 3. Test Yamasını (BORE 6.8.0) Uygula
        run: |
          cd common
          PATCH_DIR="$GITHUB_WORKSPACE/testpatch"
          echo "🚀 Test klasöründeki yamalar aranıyor: $PATCH_DIR"
          
          for patch_file in $(ls "$PATCH_DIR"/*.patch | sort); do
            filename=$(basename "$patch_file")
            echo "=================================================="
            echo "📦 İŞLENİYOR: $filename"
            echo "=================================================="
            
            # Logları kırpmadan DOĞRUDAN ekrana basıyoruz ki hatayı görelim!
            patch -p1 --fuzz=3 < "$patch_file" || {
              echo "❌ $filename UYGULANAMADI! Hatanın sebebi yukarıdaki loglardadır."
              exit 1
            }
            echo "✅ $filename başarıyla uygulandı."
          done

      # =================================================================
      # 3. KERNEL YAPILANDIRMASI VE DERLEME (Yama geçerse test et)
      # =================================================================
      - name: 4. Kernel Config Mühürlemesi
        run: |
          cd common
          export PATH="$GITHUB_WORKSPACE/clang-zyc/bin:$PATH"
          sed -i 's/^PHONY += all/  /g' Makefile || true
          touch .scmversion
          cat << 'EOF' > scripts/check-local-export
          #!/bin/sh
          exit 0
          EOF
          chmod -R +x scripts/
          mkdir -p out
          [ -x ./scripts/config ] || chmod +x ./scripts/config || true
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            gki_defconfig
            
          CONFIG_FILE="out/.config"
          
          # Sadece BORE aktif ediliyor (Test amaçlı)
          ./scripts/config --file $CONFIG_FILE -e CONFIG_SCHED_BORE
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            olddefconfig

      - name: 5. Kernel Derleme (C Kod Hatalarını Yakalamak İçin)
        run: |
          cd common
          export PATH="$GITHUB_WORKSPACE/clang-zyc/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" LD="ld.lld" HOSTCC="clang" HOSTCXX="clang++" HOSTLD="ld.lld" \
            AR="llvm-ar" NM="llvm-nm" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" STRIP="llvm-strip" \
            Image || { echo "❌ Derleme HATASI (C kodu patladı)!"; exit 1; }
          echo "✅ YAMA VE DERLEME %100 BAŞARILI!"
          
