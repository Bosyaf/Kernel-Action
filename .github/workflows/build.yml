name: Nimrodel Houji GKI (Make Final)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: 1. Paketleri Kur (Eksik Çeviriciler Eklendi)
        run: |
          sudo apt update -qq
          sudo apt install -y python3 git curl build-essential zip bc flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev xz-utils pkg-config binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: 2. Kendi Repondan Kaynak Kodunu Çek
        run: |
          echo "🚀 Bosyaf/my reposundan kaynak kod indiriliyor..."
          git clone https://github.com/Bosyaf/my.git --depth=1 kernel_workspace

      - name: 3. Kritik Hata Düzeltmesi (Canlı Yayın Özel)
        run: |
          cd kernel_workspace
          
          # Yayında patlamamıza sebep olan LLVM_IAS=0 (GNU Assembler) hatasını düzeltiyoruz.
          # LLVM_IAS=1 yaparak Clang 17'nin kendi orijinal motorunu kullanmasını sağlıyoruz.
          sed -i 's/LLVM_IAS=0/LLVM_IAS=1/g' build_kernel.sh
          
          chmod +x build_kernel.sh

      - name: 4. Çekirdeği Derle (Saf Make)
        run: |
          cd kernel_workspace
          
          echo "🔥 Derleme Başlıyor! (LTO Kapalı, Clang 17 Devrede)"
          ./build_kernel.sh

      - name: 5. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nimrodel-Houji-${{ github.run_id }}
          name: "CG+ Nimrodel Houji GKI Kernel"
          files: kernel_workspace/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
