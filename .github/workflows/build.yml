name: Houji GKI (CLO-Stable)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: 1. Gerekli Paketleri Kur
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev \
            rsync unzip bc cpio wget xz-utils pkg-config zip
            
      - name: 2. Kaynak Kodunu Çek (CLO-Stable)
        run: |
          echo "🚀 Houji (SM8650) clo-stable kaynağı indiriliyor..."
          git clone https://gitlab.com/DevUknown/kernel_xiaomi_houji_sm8650.git -b clo-stable --depth=1 kernel_workspace
          
      - name: 3. Derlemeyi Başlat (build_kernel.sh)
        run: |
          cd kernel_workspace
          chmod +x build_kernel.sh
          
          echo "🛠️ Scriptin GitHub Actions'da takılmaması için (varsa) promptlar atlanıyor..."
          # Eğer script "Hangi Clang'i indireyim?" diye sorarsa (read komutu), 
          # GitHub Actions donup kalmasın diye otomatik 1 (varsayılan) seçeneğini atıyoruz.
          sed -i 's/read -p.*/clang_choice=1/g' build_kernel.sh || true
          
          echo "🔥 build_kernel.sh Çalıştırılıyor!"
          ./build_kernel.sh
          
      - name: 4. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Houji-CLO-${{ github.run_id }}
          name: "CG+ Houji Kernel (CLO-Stable)"
          files: kernel_workspace/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
