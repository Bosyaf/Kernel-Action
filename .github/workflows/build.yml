name: Xiaomi 14 Saf Test Derlemesi (6.1.138)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernelsu_ref:
        description: "KernelSU/SukiSU tag (Varsayılan: v4.1.3)"
        required: false
        type: string
        default: "v4.1.3"

env:
  PYTHON_VERSION: "3.10"
  GKI_WORKSPACE: "/tmp/gki-build"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-swapfile: "true"

      - name: 2. Checkout code
        uses: actions/checkout@v4

      - name: 3. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 4. Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git curl wget zip unzip xz-utils openssl rsync patch

      - name: 5. Configure ccache
        run: |
          mkdir -p ~/.cache/bazel ~/.ccache
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: 6. Python Betiğini İndir
        run: |
          echo "📥 Xiaomi14 Builder betiği havada indiriliyor..."
          wget -q https://raw.githubusercontent.com/BigTiger12688/xiaomi14-gki-6138/main/.github/workflows/scripts/xiaomi14_builder.py -O xiaomi14_builder.py
          chmod +x xiaomi14_builder.py

      - name: 7. Build Xiaomi 14 Preset (Python Otomasyonu)
        run: |
          echo "🔥 Python Builder Başlatılıyor..."
          python3 xiaomi14_builder.py \
            --workspace "${{ env.GKI_WORKSPACE }}" \
            --kernelsu-ref "${{ github.event.inputs.kernelsu_ref }}"

      - name: 8. Prepare artifacts
        run: |
          echo "📦 Çıktılar Toplanıyor..."
          mkdir -p artifacts
          # Python scripti "android14-6.1-138" klasörüne çıktı verir
          cp -r "${{ env.GKI_WORKSPACE }}/android14-6.1-138/out/." artifacts/
          ls -la artifacts

      - name: 9. Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi14-saf-kernel-6.1.138
          path: artifacts/*
          if-no-files-found: error
          
