name: Houji GKI (Bazel) Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: 1. Gerekli Paketleri Kur
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev \
            rsync unzip bc cpio wget xz-utils pkg-config zip
            
      - name: 2. Kaynak Kodunu Çek (CLO-ACK)
        run: |
          # Techpack/GKI kaynağını indiriyoruz
          git clone https://gitlab.com/DevUknown/kernel_xiaomi_houji_sm8650.git -b clo-ack --depth=1 kernel_workspace

      - name: 3. Bazel ile Derlemeyi Başlat (Pineapple GKI)
        run: |
          cd kernel_workspace
          
          echo "🚀 Bazel Kleaf Derlemesi Başlıyor..."
          # Bazel'in bütün çekirdekleri kullanabilmesi için ufak bir ayar
          echo "build --jobs=$(nproc --all)" >> bazel.WORKSPACE
          
          # Derleme komutu (-t pineapple gki)
          python3 build_with_bazel.py -t pineapple gki
          
          echo "✅ Derleme Tamamlandı!"

      - name: 4. AnyKernel3 ile Paketleme (Houji Cerrah Modu)
        run: |
          cd kernel_workspace
          
          # Bazel'in çıktıları attığı klasör
          OUT_DIR="out/msm-kernel-pineapple-gki/dist"
          
          # AnyKernel klasörüne geçiş yap
          cd anykernel
          
          echo "📦 AnyKernel cihaz ayarları yapılıyor..."
          # Scripti Houji ve Shennong'a özel ayarlıyoruz
          sed -i 's/kernel.string=.*/kernel.string=CG+ Houji GKI Kernel/' anykernel.sh
          sed -i 's/device.name3=/device.name3=houji/' anykernel.sh
          sed -i 's/device.name4=/device.name4=shennong/' anykernel.sh
          
          echo "📦 Çekirdek ve Modüller kopyalanıyor..."
          # Kernel Image'ı çek
          cp ../$OUT_DIR/Image .
          
          # Varsa DTB/DTBO dosyalarını çek
          cp ../$OUT_DIR/*.dtb . 2>/dev/null || true
          cp ../$OUT_DIR/dtbo.img . 2>/dev/null || true
          
          # Bütün .ko modüllerini _modules klasörüne topla
          mkdir -p _modules
          find ../$OUT_DIR -type f -name "*.ko" -exec cp {} _modules/ \;
          
          echo "📦 Zip dosyası oluşturuluyor..."
          zip -r9 ../Houji-GKI-Bazel.zip *
          
      - name: 5. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Houji-GKI-${{ github.run_id }}
          name: "CG+ Houji GKI Kernel (Bazel)"
          files: kernel_workspace/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
