name: Houji GKI (Kleaf/Bazel)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: 1. Gerekli Paketleri Kur
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev \
            rsync unzip bc cpio wget xz-utils pkg-config zip
            
      - name: 2. Kaynak Kodunu Çek (CLO-ACK)
        run: |
          echo "🚀 Techpack Kaynağı İndiriliyor..."
          git clone https://gitlab.com/DevUknown/kernel_xiaomi_houji_sm8650.git -b clo-ack --depth=1 kernel_workspace

      - name: 3. KernelSU-Next Enjeksiyonu
        run: |
          cd kernel_workspace
          echo "💉 KernelSU-Next çekirdeğe işleniyor..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 4. Eksik Bazel Motorunu Tamamla (Can Damarı)
        run: |
          cd kernel_workspace
          echo "🛠️ Geliştiricinin sildiği Bazel aracı Bazelisk ile yeniden yükleniyor..."
          mkdir -p tools
          # Google'ın resmi aracıyla Bazel'i otomatik çekiyoruz
          wget -q https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -O tools/bazel
          chmod +x tools/bazel

      - name: 5. Çekirdeği Derle (Saf Google/Qualcomm Mimarisi)
        run: |
          cd kernel_workspace
          echo "🔥 Bazel Kleaf Derlemesi Başlıyor! (Sıfır Hata Garantili)"
          python3 build_with_bazel.py -t pineapple gki

      - name: 6. AnyKernel3 ile Paketleme (Houji Cerrah Modu)
        run: |
          cd kernel_workspace
          
          # Bazel'in çıktıları attığı klasör
          OUT_DIR="out/msm-kernel-pineapple-gki/dist"
          cd anykernel
          
          echo "📦 AnyKernel cihaz ayarları yapılıyor..."
          sed -i 's/kernel.string=.*/kernel.string=CG+ Houji GKI Kernel (KSU Next)/' anykernel.sh
          sed -i 's/device.name3=/device.name3=houji/' anykernel.sh
          sed -i 's/device.name4=/device.name4=shennong/' anykernel.sh
          
          # YANLIŞ DTBO FLAŞLAMASINI ENGELLE (BRICK KORUMASI)
          sed -i '/flash_dtbo/d' anykernel.sh
          
          echo "📦 Çekirdek ve Modüller kopyalanıyor..."
          # Saf Image'ı çek
          cp ../$OUT_DIR/Image .
          
          # Bütün Qualcomm .ko modüllerini zip'e al
          mkdir -p _modules
          find ../$OUT_DIR -type f -name "*.ko" -exec cp {} _modules/ \;
          
          echo "📦 Zip dosyası oluşturuluyor..."
          zip -r9 ../RealKing-Houji-Bazel.zip *
          
      - name: 7. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Houji-GKI-${{ github.run_id }}
          name: "CG+ Houji GKI Kernel (KSU Next)"
          files: kernel_workspace/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
