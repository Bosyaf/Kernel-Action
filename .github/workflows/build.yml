name: Houji GKI Kernel Build

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: 1. Gerekli Paketleri Kur
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            python3 git curl build-essential flex bison \
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev \
            rsync unzip bc cpio wget xz-utils pkg-config zip \
            perl

      - name: 2. Kernel Kaynağını Çek
        run: |
          git clone https://github.com/Bosyaf/my.git -b main --depth=1 kernel_workspace

      - name: 3. build_kernel.sh Fix'leri Uygula
        run: |
          cd kernel_workspace

          echo "🔧 FIX 1: LD linker'ı Clang 17'nin ld.lld'sine zorla (tlb-rmi hatası çözümü)"
          sed -i 's|export LD=ld.lld|export LD=$CLANG_DIR/bin/ld.lld|g' build_kernel.sh
          sed -i 's|    LD=ld.lld|    LD=$CLANG_DIR/bin/ld.lld|g' build_kernel.sh
          sed -i 's|    HOSTLD=ld.lld|    HOSTLD=$CLANG_DIR/bin/ld.lld|g' build_kernel.sh

          echo "🔧 FIX 2: Clang seçimini otomatik yap (CI'da prompt takılır)"
          sed -i 's/read -p "Choose \[1-2\]: " clang_choice/clang_choice=1/g' build_kernel.sh

          echo "🔧 FIX 3: tar --strip-components=1 kaldır (archive yapısı düz)"
          sed -i 's/tar -xf "\$MAIN\/\$ARCHIVE_NAME" -C "\$CLANG_DIR" --strip-components=1/tar -xf "$MAIN\/$ARCHIVE_NAME" -C "$CLANG_DIR"/g' build_kernel.sh

          echo "🔧 FIX 4: wget -P ve -O çakışmasını düzelt"
          sed -i 's|wget -P "\$MAIN" "\$CLANG_URL" -O "\$MAIN/\$ARCHIVE_NAME"|wget -O "$MAIN/$ARCHIVE_NAME" "$CLANG_URL"|g' build_kernel.sh

          echo "🔧 FIX 5: Eski clang dizinini temizle (ikinci çalıştırmada File exists hatası)"
          sed -i 's|mkdir -p "\$CLANG_DIR"|rm -rf "$CLANG_DIR" \&\& mkdir -p "$CLANG_DIR"|g' build_kernel.sh

          echo "🔧 FIX 6: anykernel.sh ayarları"
          sed -i 's/kernel.string=.*/kernel.string=CG+ Houji GKI Kernel (KSU Next)/' anykernel/anykernel.sh
          sed -i 's/device.name3=/device.name3=houji/' anykernel/anykernel.sh
          sed -i 's/device.name4=/device.name4=shennong/' anykernel/anykernel.sh

          echo "🔧 FIX 7: DTBO flash'ı engelle (brick koruması)"
          sed -i '/flash_dtbo/d' anykernel/anykernel.sh

          echo "🔧 FIX 8: Tüm .ko modüllerini al (sadece önemli olanlar değil)"
          sed -i '/IMPORTANT_MODULES=(/,/done/d' build_kernel.sh
          sed -i 's/echo "Modules in _modules:"/find "$MODULES_DIR\/lib\/modules" -type f -name "*.ko" -exec cp {} "$TEMP_ANY_KERNEL_DIR\/_modules\/" \\;\n    echo "All modules copied to _modules:"/' build_kernel.sh

          echo "🔧 FIX 9: ZIP ismini Houji yap"
          sed -i 's/RealKing-Peridot/CG-Houji-GKI/g' build_kernel.sh

          echo "✅ Tüm fix'ler uygulandı!"

      - name: 4. Çekirdeği Derle
        run: |
          cd kernel_workspace
          chmod +x build_kernel.sh
          echo "🔥 Derleme Başlıyor!"
          ./build_kernel.sh

      - name: 5. Release Yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Houji-GKI-${{ github.run_id }}
          name: "CG+ Houji GKI Kernel ${{ github.run_id }}"
          files: kernel_workspace/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
