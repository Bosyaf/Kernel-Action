name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl \
            device-tree-compiler flex gcc g++ git \
            libelf-dev libncurses-dev libssl-dev \
            lz4 make pahole perl python3 \
            rsync unzip wget zip zstd

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Bosyaf/perf
          ref: main
          path: kernel_source
          fetch-depth: 1

      - name: Download Toolchain (ZyC Clang 22)
        run: |
          mkdir -p toolchains/zyc-clang-22
          wget https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C toolchains/zyc-clang-22
          rm clang.tar.gz

      - name: Apply KSU & SUSFS & Patches
        working-directory: kernel_source
        run: |
          echo "📦 KernelSU-Next ve SUSFS kuruluyor..."
          git clone --depth=1 https://github.com/Bosyaf/Ksu-next.git KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh
          
          git clone --depth=1 https://github.com/Bosyaf/Susfs.git susfs4ksu
          cp -R susfs4ksu/kernel_patches/fs/* ./fs/
          cp -R susfs4ksu/kernel_patches/include/* ./include/
          
          SUSFS_PATCH=$(ls susfs4ksu/kernel_patches/50_add_susfs*.patch 2>/dev/null | head -1)
          [ -n "$SUSFS_PATCH" ] && patch -p1 < "$SUSFS_PATCH" || true
          rm -rf susfs4ksu

          echo "🛡️ SUSFS Dentry Fix..."
          sed -i 's/return (base->d_inode->i_mapping->flags & BIT_ANDROID_DATA_ROOT_DIR);/return (base \&\& !IS_ERR(base) \&\& base->d_inode \&\& (base->d_inode->i_mapping->flags \& BIT_ANDROID_DATA_ROOT_DIR));/g' fs/susfs.c
          sed -i 's/return (base->d_inode->i_mapping->flags & BIT_ANDROID_SDCARD_ROOT_DIR);/return (base \&\& !IS_ERR(base) \&\& base->d_inode \&\& (base->d_inode->i_mapping->flags \& BIT_ANDROID_SDCARD_ROOT_DIR));/g' fs/susfs.c
          sed -i 's/extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;/extern struct static_key_false susfs_is_sdcard_android_data_not_decrypted;/g' fs/namespace.c

      - name: Force Kconfig LTO Defaults (Kaynak Kod Yaması)
        working-directory: kernel_source
        run: |
          echo "🛠️ Kconfig kaynak kodlarında varsayılan LTO ThinLTO olarak değiştiriliyor..."
          find . -name "Kconfig*" -exec sed -i 's/default LTO_NONE/default LTO_CLANG_THIN/g' {} +

      - name: Configure Kernel Defconfig & Custom Configs
        working-directory: kernel_source
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/zyc-clang-22/bin:$PATH"
          export OUT_DIR="$(pwd)/out"
          
          MAKE_OPTS="ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1"
          
          # 1. Defconfig yükle
          make O="$OUT_DIR" $MAKE_OPTS houji_gki_defconfig
          
          # 2. Özel Config'leri zorla aç
          CONFIG_FILE="$OUT_DIR/.config"
          ./scripts/config --file $CONFIG_FILE --disable CONFIG_LTO_NONE
          ./scripts/config --file $CONFIG_FILE --disable CONFIG_LTO_CLANG_FULL
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_HAS_LTO_CLANG
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_LTO_CLANG
          ./scripts/config --file $CONFIG_FILE --enable CONFIG_LTO_CLANG_THIN
          
          ./scripts/config --file $CONFIG_FILE --module CONFIG_SCHED_WALT
          ./scripts/config --file $CONFIG_FILE --disable CONFIG_SCHED_CLUSTER
          
          # 3. olddefconfig çalıştır
          make O="$OUT_DIR" $MAKE_OPTS olddefconfig
          
          # 4. KONTROL: LTO Gerçekten Açıldı mı?
          echo "=== LTO DURUM KONTROLÜ ==="
          grep LTO "$OUT_DIR/.config"

      - name: Build Kernel Image
        working-directory: kernel_source
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/zyc-clang-22/bin:$PATH"
          export OUT_DIR="$(pwd)/out"
          MAKE_OPTS="ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1"
          
          make -j$(nproc --all) O="$OUT_DIR" $MAKE_OPTS

      - name: Package AnyKernel3 ZIP
        working-directory: kernel_source
        run: |
          TIME=$(date "+%Y%m%d-%H%M%S")
          ZIP_NAME="RealKing-Peridot-$TIME.zip"
          
          mkdir -p anykernel_temp
          cp -r anykernel/* anykernel_temp/
          cp out/arch/arm64/boot/Image* anykernel_temp/ 2>/dev/null || true
          
          cd anykernel_temp
          zip -r9 "$GITHUB_WORKSPACE/kernel_source/$ZIP_NAME" ./*
          
      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealKing-Peridot-Kernel
          path: kernel_source/RealKing-Peridot-*.zip
          if-no-files-found: error
