name: Build SM8650 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - sched_ext

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. Disk Alanı Açma
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      # 2. Sistem Bağımlılıkları ve Java
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison cpio curl flex git \
            git-lfs libelf-dev libncurses-dev libssl-dev \
            lz4 make openjdk-17-jdk pahole perl python3 \
            python3-pip rsync tar unzip wget zip zstd

      # 3. Bazel (Bazelisk) İndirme ve 'tools/bazel' Konumuna Kurma
      - name: Setup Bazel Binary
        run: |
          mkdir -p tools
          curl -L -o tools/bazel https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
          chmod +x tools/bazel
          echo "$(pwd)/tools" >> $GITHUB_PATH

      # 4. Kernel Kaynağını Çekme
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Kyuofox-Studio/android_kernel_xiaomi_sm8650
          ref: sched_ext
          path: kernel_source
          fetch-depth: 1

      # 5. build_with_bazel.py İle Derleme
      - name: Build Kernel with Bazel
        working-directory: kernel_source
        run: |
          chmod +x build_with_bazel.py
          python3 build_with_bazel.py -t pineapple gki --log info

      # 6. Derlenen Çıktıları Paketleme
      - name: Prepare Artifacts
        if: always()
        run: |
          mkdir -p dist_output
          find kernel_source/out/ -type f \( -name "Image*" -o -name "*.ko" -o -name "*.img" \) -exec cp -v {} dist_output/ \; 2>/dev/null || true
          cd dist_output
          zip -r9 ../Kernel-SM8650-Output.zip ./* || true

      # 7. Artifact Yükleme
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM8650-Kernel-sched_ext
          path: Kernel-SM8650-Output.zip
          if-no-files-found: warn
          retention-days: 7
