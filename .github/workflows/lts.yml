
name: Bosyaf (Yuki Clang 24 LLVM Build)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"

    steps:

      # ==========================================
      # 1. MAXIMIZE BUILD SPACE
      # ==========================================

      - name: Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-gb: 16

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. DEPENDENCIES
      # ==========================================

      - name: Install Build Dependencies
        run: |
          sudo apt update -qq

          sudo apt install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            llvm \
            python3 \
            git \
            curl \
            wget \
            libelf-dev \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            liblz4-tool \
            zlib1g-dev \
            libxml2-utils \
            rsync \
            unzip \
            dwarves \
            bc \
            cpio \
            xz-utils \
            zstd \
            make \
            pkg-config \
            zip \
            perl

      # ==========================================
      # 3. YUKI CLANG 24
      # ==========================================

      - name: Download Yuki Clang 24
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/yuki-clang"

          CLANG_URL="https://kota.klozz.dev/downloads/Yuki-Clang-24.0.0-20261113.tar.zst"

          echo "Downloading Yuki Clang 24.0.0..."

          mkdir -p "$TOOLCHAIN_DIR"

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            "$CLANG_URL" \
            -o "$GITHUB_WORKSPACE/yuki-clang.tar.zst"

          echo "Extracting toolchain..."

          tar --zstd -xf \
            "$GITHUB_WORKSPACE/yuki-clang.tar.zst" \
            -C "$TOOLCHAIN_DIR"

          rm -f "$GITHUB_WORKSPACE/yuki-clang.tar.zst"

          CLANG_BIN="$(find "$TOOLCHAIN_DIR" \
            -path '*/bin/clang' -print -quit | xargs -r dirname)"

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang executable not found!"
            find "$TOOLCHAIN_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"

          echo "========== YUKI CLANG =========="

          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version

          echo "========== LLVM TOOL CHECK =========="

          for tool in \
            clang \
            clang++ \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip \
            llvm-ranlib; do

            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "ERROR: Missing LLVM tool: $tool"
              exit 1
            fi

            echo "FOUND: $tool"
          done

          echo "Yuki Clang 24 ready!"

      # ==========================================
      # 4. SOURCE DOWNLOAD
      # ==========================================

      - name: Download Kernel Sources
        run: |
          git clone --depth=1 \
            https://github.com/Bosyaf/AnyKernel3.git \
            AnyKernel3

          git clone --depth=1 \
            https://github.com/Bosyaf/lineage-22.2.git \
            common

      # ==========================================
      # 5. KERNELSU NEXT
      # ==========================================

      - name: KernelSU-Next Installation
        shell: bash
        run: |
          set -euo pipefail

          cd common

          echo "Installing KernelSU-Next..."

          git clone --depth=1 \
            https://github.com/Bosyaf/Ksu-next.git \
            KernelSU-Next

          bash KernelSU-Next/kernel/setup.sh

          echo "KernelSU-Next installed!"

          PATCH="$GITHUB_WORKSPACE/patches/ksu/ksun-add-more-managers-support.patch"

          if [ -f "$PATCH" ]; then

            echo "Applying Multi-Manager patch..."

            cd KernelSU-Next

            if patch --batch --forward --fuzz=0 -p1 < "$PATCH"; then
              echo "Multi-Manager patch processed."
            else
              echo "ERROR: Multi-Manager patch failed."
              find . -name '*.rej' -print
              exit 1
            fi

            cd ..

          else
            echo "Multi-Manager patch not found. Skipping."
          fi

      # ==========================================
      # 6. SUSFS
      # ==========================================

      - name: SUSFS Installation and Fixes
        shell: bash
        run: |
          set -euo pipefail

          cd common

          echo "Downloading SUSFS..."

          git clone --depth=1 \
            https://github.com/Bosyaf/Susfs.git \
            susfs4ksu

          echo "Copying SUSFS files..."

          cp -a susfs4ksu/kernel_patches/fs/. fs/
          cp -a susfs4ksu/kernel_patches/include/. include/

          echo "Applying main SUSFS patch..."

          SUSFS_PATCH="$(find susfs4ksu/kernel_patches \
            -maxdepth 1 \
            -name '50_add_susfs*.patch' \
            -print -quit)"

          if [ -n "$SUSFS_PATCH" ]; then

            if patch --batch --forward --fuzz=0 -p1 < "$SUSFS_PATCH"; then
              echo "SUSFS patch processed."
            else
              echo "ERROR: SUSFS patch failed."
              find . -name '*.rej' -print
              exit 1
            fi

          else
            echo "ERROR: Main SUSFS patch not found."
            exit 1
          fi

          echo "Downloading fs_namespace patch..."

          if ! wget -q \
            "https://raw.githubusercontent.com/Bosyaf/Kernel-Action/main/fs_namespace.patch" \
            -O fs_namespace.patch; then

            curl -fLSs \
              "https://raw.githubusercontent.com/Bosyaf/Kernel-Action/main/fs_namespace.patch" \
              -o fs_namespace.patch
          fi

          if [ -s fs_namespace.patch ]; then

            if patch --batch --forward --fuzz=0 -p1 < fs_namespace.patch; then
              echo "Namespace patch processed."
            else
              echo "ERROR: Namespace patch failed."
              find . -name '*.rej' -print
              exit 1
            fi

          else
            echo "ERROR: Namespace patch is empty."
            exit 1
          fi

          rm -f fs_namespace.patch

          # SUSFS DENTRY FIX

          if [ -f fs/susfs.c ]; then

            sed -i \
              's/return (base->d_inode->i_mapping->flags & BIT_ANDROID_DATA_ROOT_DIR);/return (base \&\& !IS_ERR(base) \&\& base->d_inode \&\& (base->d_inode->i_mapping->flags \& BIT_ANDROID_DATA_ROOT_DIR));/g' \
              fs/susfs.c

            sed -i \
              's/return (base->d_inode->i_mapping->flags & BIT_ANDROID_SDCARD_ROOT_DIR);/return (base \&\& !IS_ERR(base) \&\& base->d_inode \&\& (base->d_inode->i_mapping->flags \& BIT_ANDROID_SDCARD_ROOT_DIR));/g' \
              fs/susfs.c

          fi

          # HOUJI STATIC KEY FIX

          if [ -f fs/namespace.c ]; then

            sed -i \
              's/extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;/extern struct static_key_false susfs_is_sdcard_android_data_not_decrypted;/g' \
              fs/namespace.c

          fi

          rm -rf susfs4ksu

          echo "SUSFS installation completed!"

      # ==========================================
      # 7. STANDARD PATCHES
      # ==========================================

      - name: Apply Standard Patches
        shell: bash
        run: |
          set -euo pipefail

          cd common

          PATCH_DIR="../hjpatches"

          if [ ! -d "$PATCH_DIR" ]; then
            echo "No hjpatches directory. Skipping."
            exit 0
          fi

          while IFS= read -r -d '' patch_file; do

            filename="$(basename "$patch_file")"

            echo "===================================="
            echo "Applying: $filename"

            if patch --batch --forward --fuzz=0 -p1 < "$patch_file"; then
              echo "SUCCESS: $filename"
            else
              echo "FAILED: $filename"
              find . -name '*.rej' -print
              exit 1
            fi

          done < <(
            find "$PATCH_DIR" \
              -maxdepth 1 \
              -name '*.patch' \
              -print0 | sort -z
          )

          echo "All standard patches processed."

      # ==========================================
      # 8. CUSTOM SCRIPTS
      # ==========================================

      - name: Run Custom Scripts
        shell: bash
        run: |
          set -uo pipefail

          cd common

          KERNEL_SRC_ABS="$(pwd)"
          SCRIPT_ROOT="../hjshpy"

          if [ ! -d "$SCRIPT_ROOT" ]; then
            echo "No custom scripts directory."
            exit 0
          fi

          while IFS= read -r -d '' sub_dir; do

            dir_name="$(basename "$sub_dir")"

            echo "===================================="
            echo "Script group: $dir_name"

            sh_file="$(find "$sub_dir" \
              -maxdepth 1 \
              -name '*.sh' \
              -print -quit)"

            if [ -z "$sh_file" ]; then
              echo "No shell script found."
              continue
            fi

            script_name="$(basename "$sh_file")"

            cd "$sub_dir"

            chmod +x "$script_name"

            export KERNEL_SRC="$KERNEL_SRC_ABS"

            set +e

            ./"$script_name" 2>&1 | tee script_run.log

            SCRIPT_STATUS=${PIPESTATUS[0]}

            set -e

            if [ "$SCRIPT_STATUS" -eq 0 ]; then
              echo "SUCCESS: $script_name"
            else
              echo "WARNING: $script_name failed."
            fi

            cd "$KERNEL_SRC_ABS"

          done < <(
            find "$SCRIPT_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print0 | sort -z
          )

          echo "Custom scripts completed."

      # ==========================================
      # 9. LLVM KERNEL CONFIGURATION
      # ==========================================

      - name: Kernel Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd common

          echo "========== YUKI CLANG =========="

          clang --version
          ld.lld --version

          touch .scmversion

          chmod +x scripts/config

          mkdir -p out

          # ======================================
          # HOUJI DEFCONFIG
          # ======================================

          echo "Loading houji_defconfig..."

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            houji_defconfig

          CONFIG_FILE="out/.config"

          # ======================================
          # NETWORK: BBR3 + FQ
          # ======================================

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_TCP_CONG_ADVANCED

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_TCP_CONG_BBR3

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_DEFAULT_BBR3

          scripts/config --file "$CONFIG_FILE" \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr3"

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_NET_SCH_FQ

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_NET_SCH_DEFAULT

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_DEFAULT_FQ

          scripts/config --file "$CONFIG_FILE" \
            --set-str CONFIG_DEFAULT_NET_SCH "fq"

          # ======================================
          # KERNEL CMDLINE
          # ======================================

          scripts/config --file "$CONFIG_FILE" \
            --set-str CONFIG_CMDLINE \
            "console=ttynull stack_depot_disable=on kvm-arm.mode=protected bootconfig noirqdebug nosoftlockup nmi_watchdog=0 quiet kasan.page_alloc.sample=0 kasan.stacktrace=off kasan=off slub_debug=- page_owner=off debug_guardpage_minorder=0"

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_CMDLINE_EXTEND

          # ======================================
          # SCHEDULER / HZ / THERMAL
          # ======================================

          scripts/config --file "$CONFIG_FILE" --disable CONFIG_SCHED_CLUSTER
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_SCHED_SMT

          scripts/config --file "$CONFIG_FILE" --disable CONFIG_HZ_100
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_HZ_250
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_HZ_300
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_HZ_500
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_HZ_1000
          scripts/config --file "$CONFIG_FILE" --set-val CONFIG_HZ 300

          scripts/config --file "$CONFIG_FILE" --enable CONFIG_NO_HZ_IDLE
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_NO_HZ_FULL

          scripts/config --file "$CONFIG_FILE" --enable CONFIG_THERMAL_GOV_STEP_WISE
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_THERMAL_GOV_POWER_ALLOCATOR

          scripts/config --file "$CONFIG_FILE" --disable CONFIG_THERMAL_DEFAULT_GOV_STEP_WISE
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_THERMAL_DEFAULT_GOV_POWER_ALLOCATOR

          # ======================================
          # CLANG THIN LTO
          # ======================================

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_LTO_CLANG

          scripts/config --file "$CONFIG_FILE" \
            --enable CONFIG_LTO_CLANG_THIN

          scripts/config --disable CONFIG_LTO_CLANG_FULL 2>/dev/null || true
          scripts/config --disable CONFIG_LTO_NONE 2>/dev/null || true

          # ======================================
          # PREEMPTION
          # ======================================

          scripts/config --file "$CONFIG_FILE" --disable CONFIG_PREEMPT_NONE
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_PREEMPT_VOLUNTARY
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_PREEMPT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_PREEMPT_COUNT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_PREEMPTION

          # ======================================
          # NETWORK / FILESYSTEM
          # ======================================

          scripts/config --file "$CONFIG_FILE" --enable CONFIG_WIREGUARD
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_IP_NF_TARGET_TTL
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_IP6_NF_TARGET_HL
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_IP6_NF_MATCH_HL

          scripts/config --file "$CONFIG_FILE" --enable CONFIG_TMPFS_POSIX_ACL
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_TMPFS_XATTR

          # ======================================
          # DEBUG OPTIONS
          # ======================================

          scripts/config --file "$CONFIG_FILE" --disable CONFIG_NUMA_BALANCING
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_REDUCED
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_COMPRESSED
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_SPLIT
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_DWARF5

          # ======================================
          # KERNELSU / SUSFS
          # ======================================

          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          scripts/config --file "$CONFIG_FILE" --disable CONFIG_KSU_SUSFS_ENABLE_LOG
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SUS_MAP

          # ======================================
          # LOCAL VERSION
          # ======================================

          scripts/config --file "$CONFIG_FILE" \
            --set-str CONFIG_LOCALVERSION "-galadriel"

          scripts/config --file "$CONFIG_FILE" \
            --disable CONFIG_LOCALVERSION_AUTO

          # ======================================
          # FINAL CONFIG RESOLUTION
          # ======================================

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "========== FINAL CONFIG =========="

          grep -E \
            'CONFIG_(HZ=|HZ_300|LTO_CLANG|LTO_CLANG_THIN|DEFAULT_TCP_CONG|DEFAULT_NET_SCH|TCP_CONG_BBR3|KSU|KSU_SUSFS|THERMAL_DEFAULT_GOV)' \
            out/.config || true

          echo "========== LLVM CONFIG CHECK =========="

          grep -E 'CONFIG_LTO_CLANG_THIN=y' out/.config || \
            echo "WARNING: ThinLTO is not enabled after olddefconfig."

          echo "========== CONFIGURATION COMPLETE =========="

      # ==========================================
      # 10. KERNEL BUILD
      # ==========================================

      - name: Build Kernel (Yuki Clang 24 LLVM)
        shell: bash
        run: |
          set -euo pipefail

          cd common

          echo "========== COMPILER =========="

          clang --version
          ld.lld --version

          echo "========== LLVM BUILD =========="

          BUILD_START=$(date +%s)

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          IMAGE_TIME=$(($(date +%s) - BUILD_START))

          echo "===================================="
          echo "Image build completed!"
          echo "Build time: $((IMAGE_TIME/60)) minutes $((IMAGE_TIME%60)) seconds"
          echo "===================================="

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

          echo "Image size:"
          du -h "$IMAGE"

          echo "BOOTHASH=Nimrodel-$(date +%s%N | cut -c1-10)" >> "$GITHUB_ENV"

      # ==========================================
      # 11. ANYKERNEL3 PACKAGE
      # ==========================================

      - name: AnyKernel3 Packaging
        shell: bash
        run: |
          set -euo pipefail

          cd AnyKernel3

          sed -i \
            's/kernel.string=.*/kernel.string=CG+ Galadriel Kernel/' \
            anykernel.sh

          sed -i \
            's/do.devicecheck=1/do.devicecheck=0/' \
            anykernel.sh

          sed -i \
            's/is_slot_device=0/is_slot_device=auto/' \
            anykernel.sh

          sed -i \
            '/is_slot_device=auto/a device.name1=houji\ndevice.name2=shennong\ndevice.name3=aurora\ndevice.name4=xiaomi14' \
            anykernel.sh

          cp ../common/out/arch/arm64/boot/Image .

          zip -r ../CG-Galadriel.zip ./*

          echo "========== PACKAGE =========="

          du -h ../CG-Galadriel.zip

          test -s ../CG-Galadriel.zip

      #==========================================
      # 12. GITHUB RELEASE
      # ==========================================

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "CG+ Galadriel (Yuki Clang 24.0.0)"
          files: CG-Galadriel.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
