name: Build Xiaomi 14 Kernel (Yuki Clang 24)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: fedora:rawhide

    steps:
      - name: Bağımlılıkları Kur (Fedora Rawhide)
        run: |
          dnf clean all
          dnf install -y --setopt=install_weak_deps=False \
            bc bison flex gcc gcc-c++ git make openssl-devel \
            elfutils-libelf-devel perl python3 zstd tar xz ccache patch findutils diffutils
          
          echo "🔍 Sistem GLIBC Sürümü:"
          getconf GNU_LIBC_VERSION

      - name: Kaynak Kodları Çek
        run: |
          git clone --depth=1 https://github.com/Bosyaf/my8650.git common
          git clone --depth=1 https://github.com/Bosyaf/Kernel-Action.git action_repo

      - name: Yuki Clang 24.0.0 İndir ve Birleştir
        run: |
          mkdir -p /opt/clang-yuki
          cd /tmp
          
          echo "⬇️ Yuki Clang parçaları indiriliyor..."
          curl -sSL -O "https://github.com/Bosyaf/cg/releases/download/yuki-clang-24.0.0-0ea123d-20261113/Yuki-Clang-24.0.0-0ea123d-20261113.tar.zst.part-00"
          curl -sSL -O "https://github.com/Bosyaf/cg/releases/download/yuki-clang-24.0.0-0ea123d-20261113/Yuki-Clang-24.0.0-0ea123d-20261113.tar.zst.part-01"
          curl -sSL -O "https://github.com/Bosyaf/cg/releases/download/yuki-clang-24.0.0-0ea123d-20261113/Yuki-Clang-24.0.0-0ea123d-20261113.tar.zst.sha256"

          echo "🧩 Arşiv parçaları birleştiriliyor..."
          cat Yuki-Clang-24.0.0-0ea123d-20261113.tar.zst.part-00 Yuki-Clang-24.0.0-0ea123d-20261113.tar.zst.part-01 > Yuki-Clang-24.0.0.tar.zst

          echo "📦 Arşiv açılıyor..."
          tar --zstd -xf Yuki-Clang-24.0.0.tar.zst -C /opt/clang-yuki
          rm -rf /tmp/Yuki-Clang*

          echo "✅ Yuki Clang Doğrulama:"
          /opt/clang-yuki/bin/clang --version

      - name: KernelSU-Next ve SUSFS Entegrasyonu
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/rifs28/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          git clone --depth=1 https://github.com/Bosyaf/Susfs.git susfs_src
          cp susfs_src/kernel_patches/fs/* fs/
          cp susfs_src/kernel_patches/include/linux/* include/linux/
          rm -rf susfs_src

      - name: Yamaları Uygula
        run: |
          cd common
          if [ -d "../action_repo/hjpatches" ]; then
            for p in ../action_repo/hjpatches/*.patch; do
              [ -f "$p" ] && patch -p1 < "$p" || true
            done
          fi

      - name: Defconfig ve BBRv3 Yapılandırması
        run: |
          cd common
          make O=out ARCH=arm64 custom_defconfig
          CONFIG_FILE="out/.config"
          
          # BBRv3 & FQ Ayarları
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_TCP_CONG_BBR3
          ./scripts/config --file "$CONFIG_FILE" --set-str CONFIG_DEFAULT_TCP_CONG "bbr3"
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_NET_SCH_FQ
          ./scripts/config --file "$CONFIG_FILE" --set-str CONFIG_DEFAULT_NET_SCH "fq"
          
          make O=out ARCH=arm64 olddefconfig

      - name: Kernel Derle (Yuki Clang 24)
        run: |
          cd common
          export PATH="/opt/clang-yuki/bin:$PATH"
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=/opt/clang-yuki/bin/clang \
            LD=/opt/clang-yuki/bin/ld.lld \
            AR=/opt/clang-yuki/bin/llvm-ar \
            NM=/opt/clang-yuki/bin/llvm-nm \
            OBJCOPY=/opt/clang-yuki/bin/llvm-objcopy \
            OBJDUMP=/opt/clang-yuki/bin/llvm-objdump \
            READELF=/opt/clang-yuki/bin/llvm-readelf \
            STRIP=/opt/clang-yuki/bin/llvm-strip \
            HOSTCC=/opt/clang-yuki/bin/clang \
            HOSTCXX=/opt/clang-yuki/bin/clang++ \
            LLVM=1 LLVM_IAS=1 Image.gz

      - name: AnyKernel3 Paketle
        run: |
          git clone --depth=1 https://github.com/Bosyaf/AnyKernel3.git ak3
          cp common/out/arch/arm64/boot/Image.gz ak3/
          cd ak3
          zip -r9 ../Xiaomi14-YukiClang-Kernel.zip * -x .git README.md

      - name: Zipli Kernel Artefaktını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi14-YukiClang-Kernel
          path: Xiaomi14-YukiClang-Kernel.zip
