name: Bosyaf (patch denemeleri )

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    container:
      image: fedora:rawhide
    timeout-minutes: 420
    defaults:
      run:
        shell: bash
    env:
      KBUILD_BUILD_USER: "bos"
      KBUILD_BUILD_HOST: "yaf"

    steps:
      - name: 1. Fedora paketlerini kur
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 git curl elfutils-libelf-devel \
            gcc gcc-c++ make glibc-devel binutils \
            flex bison openssl-devel ncurses-devel \
            lz4 zlib-ng-compat-devel libxml2 \
            rsync unzip zip dwarves bc cpio wget xz \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            pkgconf-pkg-config zstd patch diffutils findutils \
            tar gzip bzip2 perl hostname which procps-ng sudo kmod

          dnf clean all
          rm -rf /var/cache/dnf

          echo "🔍 Fedora GLIBC sürümü:"
          ldd --version | sed -n '1p'

      - name: 2. Checkout
        uses: actions/checkout@v4

      - name: 3. Yuki Clang 24 indir, doğrula ve aç
        run: |
          set -Eeuo pipefail

          TAG="yuki-clang-24.0.0-0ea123d-20261113"
          ARCHIVE="Yuki-Clang-24.0.0-0ea123d-20261113.tar.zst"
          BASE_URL="https://github.com/Bosyaf/cg/releases/download/${TAG}"
          DOWNLOAD_DIR="$RUNNER_TEMP/yuki-clang"
          INSTALL_DIR="/opt/clang-yuki"

          PART0="${ARCHIVE}.part-00"
          PART1="${ARCHIVE}.part-01"
          CHECKSUM="${ARCHIVE}.sha256"

          mkdir -p "$DOWNLOAD_DIR"
          cd "$DOWNLOAD_DIR"

          download_asset() {
            local asset="$1"
            local output="$2"

            echo "İndiriliyor: $asset"
            curl --fail --location --show-error --http1.1 \
              --retry 12 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 0 \
              --continue-at - \
              --output "$output" \
              "${BASE_URL}/${asset}"

            test -s "$output" || {
              echo "HATA: $asset indirilemedi veya boş."
              exit 1
            }
          }

          # GitHub Release asset adları büyük/küçük harfe duyarlıdır.
          download_asset "$PART0" "$PART0"
          download_asset "$PART1" "$PART1"
          download_asset "$CHECKSUM" "$CHECKSUM"

          echo "İndirilen dosyalar:"
          ls -lh "$PART0" "$PART1" "$CHECKSUM"

          echo "Parçalar birleştiriliyor..."
          cat "$PART0" "$PART1" > "$ARCHIVE"
          test -s "$ARCHIVE"

          echo "SHA256 doğrulanıyor..."
          EXPECTED_SHA="$(awk 'NR==1 {print $1}' "$CHECKSUM")"
          if [[ ! "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "HATA: SHA256 dosyası geçersiz:"
            cat "$CHECKSUM"
            exit 1
          fi
          echo "${EXPECTED_SHA}  ${ARCHIVE}" | sha256sum --check -

          echo "Zstandard arşivi test ediliyor..."
          zstd -t "$ARCHIVE"

          echo "Arşiv açılıyor..."
          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"
          tar --use-compress-program=zstd -xf "$ARCHIVE" -C "$INSTALL_DIR"

          echo "Arşiv içindeki derleyici aranıyor..."
          CLANG_PATH="$(find "$INSTALL_DIR" -type f -name clang -perm /111 -print -quit)"
          if [[ -z "$CLANG_PATH" ]]; then
            echo "HATA: Arşiv açıldı ama çalıştırılabilir clang bulunamadı."
            find "$INSTALL_DIR" -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          YUKI_BIN="$(dirname "$CLANG_PATH")"
          for tool in clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            if [[ ! -x "$YUKI_BIN/$tool" ]]; then
              echo "HATA: Gerekli araç bulunamadı: $YUKI_BIN/$tool"
              find "$INSTALL_DIR" -maxdepth 5 -type f -print | sed -n '1,100p'
              exit 1
            fi
          done

          echo "$YUKI_BIN" >> "$GITHUB_PATH"
          echo "YUKI_BIN=$YUKI_BIN" >> "$GITHUB_ENV"

          echo "Clang yolu: $YUKI_BIN"
          "$YUKI_BIN/clang" --version
          "$YUKI_BIN/ld.lld" --version

          rm -f "$PART0" "$PART1" "$CHECKSUM" "$ARCHIVE"
          echo "Yuki Clang 24 başarıyla indirildi, doğrulandı ve açıldı."


      - name: 4. Kaynakları çek
        run: |
          git clone https://github.com/Bosyaf/AnyKernel3.git --depth 1 AnyKernel3
          # GKI Kernel kaynağını "common" klasörüne çeker
          git clone --depth=1 https://github.com/Bosyaf/my8650.git common

      - name: 5. KernelSU-Next ve Multi-Manager desteği
        run: |
          cd common
          echo "📦 [1/5] KernelSU-Next kuruluyor (Bosyaf/Ksu-next)..."
          git clone --depth=1 https://github.com/Bosyaf/Ksu-next.git KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh
          echo "✅ [1/5] KernelSU-Next kurulumu tamamlandı!"

          echo "🔥 [2/5] Multi-Manager patch uygulanıyor..."
          PATCH="$GITHUB_WORKSPACE/patches/ksu/ksun-add-more-managers-support.patch"

          if [ -f "$PATCH" ]; then
            cd KernelSU-Next
            if patch -p1 --forward < "$PATCH"; then
              echo "✅ [2/5] Multi-Manager patch başarılı!"
            else
              echo "⚠️ [2/5] Patch uygulanamadı; zaten uygulanmış olabilir."
            fi
            cd ..
          else
            echo "⚠️ [2/5] Patch dosyası bulunamadı, atlanıyor..."
          fi

      - name: 6. SUSFS4KSU kurulumu ve fixler
        run: |
          cd common
          echo "📦 [3/5] SUSFS kuruluyor (Bosyaf/Susfs)..."
          git clone --depth=1 https://github.com/Bosyaf/Susfs.git susfs4ksu

          echo "📦 SUSFS dosyaları kopyalanıyor..."
          cp -R susfs4ksu/kernel_patches/fs/* ./fs/
          cp -R susfs4ksu/kernel_patches/include/* ./include/
          echo "✅ [3/5] SUSFS dosyaları kopyalandı!"

          echo "📦 [3.1/5] Ana SUSFS patch uygulanıyor..."
          SUSFS_PATCH=$(ls susfs4ksu/kernel_patches/50_add_susfs*.patch 2>/dev/null | head -1)

          if [ -n "$SUSFS_PATCH" ]; then
            echo "  → Uygulanıyor: $(basename "$SUSFS_PATCH")"
            patch -p1 < "$SUSFS_PATCH" || true
            echo "✅ [3.1/5] Ana SUSFS patch adımı tamamlandı."
          else
            echo "⚠️ [3.1/5] Patch dosyası bulunamadı, atlanıyor..."
          fi

          echo "📦 [4/5] fs_namespace.patch uygulanıyor..."
          if ! wget -q \
            "https://raw.githubusercontent.com/Bosyaf/Kernel-Action/main/fs_namespace.patch" \
            -O fs_namespace.patch; then
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/Bosyaf/Kernel-Action/main/fs_namespace.patch" \
              -o fs_namespace.patch
          fi

          if [ -s fs_namespace.patch ]; then
            patch -p1 < fs_namespace.patch || true
            echo "✅ [4/5] fs_namespace.patch adımı tamamlandı!"
          else
            echo "⚠️ [4/5] Patch bulunamadı."
          fi
          rm -f fs_namespace.patch

          echo "🛡️ [5/5] SUSFS Dentry Check Fix uygulanıyor..."
          sed -i \
            's/return (base->d_inode->i_mapping->flags & BIT_ANDROID_DATA_ROOT_DIR);/return (base \&\& !IS_ERR(base) \&\& base->d_inode \&\& (base->d_inode->i_mapping->flags \& BIT_ANDROID_DATA_ROOT_DIR));/g' \
            fs/susfs.c
          sed -i \
            's/return (base->d_inode->i_mapping->flags & BIT_ANDROID_SDCARD_ROOT_DIR);/return (base \&\& !IS_ERR(base) \&\& base->d_inode \&\& (base->d_inode->i_mapping->flags \& BIT_ANDROID_SDCARD_ROOT_DIR));/g' \
            fs/susfs.c

          # HOUJI CUSTOM FIX: True/False çakışmasını gideren canlı yama
          sed -i \
            's/extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;/extern struct static_key_false susfs_is_sdcard_android_data_not_decrypted;/g' \
            fs/namespace.c

          echo "✅ [5/5] Canlı yama adımı tamamlandı!"
          find . -name "*.rej" -delete 2>/dev/null || true
          rm -rf susfs4ksu
          echo "🎉 SUSFS adımları tamamlandı!"

      - name: 7. Standart yamalar (hjpatches)
        run: |
          cd common
          PATCH_DIR="../hjpatches"
          echo "🚀 Standart yamalar uygulanıyor..."

          shopt -s nullglob
          for patch_file in "$PATCH_DIR"/*.patch; do
            filename=$(basename "$patch_file")
            echo "Uygulanıyor: $filename"

            set +e
            patch -p1 --fuzz=0 < "$patch_file" > patch_log.txt 2>&1
            PATCH_STATUS=$?
            set -e

            if [ "$PATCH_STATUS" -eq 0 ]; then
              echo "✅ $filename"
            else
              echo "❌ $filename uygulanamadı. Hata logu:"
              cat patch_log.txt
            fi

            rm -f patch_log.txt
          done

      - name: 8. Cerrahi scriptler (hjshpy)
        run: |
          cd common
          KERNEL_SRC_ABS=$(pwd)
          SCRIPT_ROOT="../hjshpy"
          echo "🚀 Cerrahi scriptler başlatılıyor..."

          for sub_dir in $(ls -d "$SCRIPT_ROOT"/*/ 2>/dev/null | sort); do
            if [ -d "$sub_dir" ]; then
              dir_name=$(basename "$sub_dir")
              echo "--------------------------------------------------"
              echo "💉 Klasör grubu: $dir_name"

              sh_file=$(find "$sub_dir" -maxdepth 1 -name "*.sh" | head -n 1)

              if [ -n "$sh_file" ]; then
                script_name=$(basename "$sh_file")
                echo "⚙️ Çalıştırılıyor: $script_name"

                cd "$sub_dir"
                chmod +x "$script_name"
                export KERNEL_SRC="$KERNEL_SRC_ABS"

                set +e
                ./"$script_name" > script_run.log 2>&1
                SCRIPT_STATUS=$?
                set -e

                head -n 20 script_run.log || true

                if [ "$SCRIPT_STATUS" -eq 0 ]; then
                  echo "✅ $script_name başarıyla bitti."
                else
                  echo "⚠️ $script_name hata verdi; sıradaki script çalıştırılacak."
                fi

                cd "$KERNEL_SRC_ABS"
              else
                echo "⚠️ $dir_name içinde .sh dosyası bulunamadı, atlanıyor."
              fi
            fi
          done

          echo "✅ Cerrahi script döngüsü tamamlandı."

      - name: 9. Kernel config ve derleme hazırlığı
        run: |
          cd common

          export PATH="$YUKI_BIN:$PATH"
          echo "🔍 Aktif Clang yolu:"
          command -v clang
          "$YUKI_BIN/clang" --version

          sed -i 's/^PHONY += all/  /g' Makefile || true
          touch .scmversion

          cat << 'EOF' > scripts/check-local-export
          #!/bin/sh
          exit 0
          EOF

          chmod -R +x scripts/
          mkdir -p out
          [ -x ./scripts/config ] || chmod +x ./scripts/config || true

          # ThinLTO'nun olddefconfig tarafından sıfırlanmasını engeller
          find . -name "Kconfig*" -exec sed -i 's/default LTO_NONE/default LTO_CLANG_THIN/g' {} + || true

          # Ağ ayarları (TCP BBR3 & FQ)
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          sed -i '/CONFIG_DEFAULT_TCP_CONG/d' "$DEFCONFIG"
          sed -i '/CONFIG_DEFAULT_NET_SCH/d' "$DEFCONFIG"
          sed -i '/CONFIG_NET_SCH_DEFAULT/d' "$DEFCONFIG"
          sed -i '/CONFIG_DEFAULT_FQ/d' "$DEFCONFIG"
          sed -i '/CONFIG_DEFAULT_PFIFO_FAST/d' "$DEFCONFIG"
          sed -i '/CONFIG_DEFAULT_CUBIC/d' "$DEFCONFIG"
          sed -i '/CONFIG_DEFAULT_BBR/d' "$DEFCONFIG"

          cat << 'EOF' | sed 's/^[[:space:]]*//' >> "$DEFCONFIG"
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_DEFAULT_BBR3=y
          CONFIG_DEFAULT_TCP_CONG="bbr3"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          EOF

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$YUKI_BIN/clang" LD="$YUKI_BIN/ld.lld" \
            HOSTCC="$YUKI_BIN/clang" HOSTCXX="$YUKI_BIN/clang++" HOSTLD="$YUKI_BIN/ld.lld" \
            AR="$YUKI_BIN/llvm-ar" NM="$YUKI_BIN/llvm-nm" \
            OBJCOPY="$YUKI_BIN/llvm-objcopy" OBJDUMP="$YUKI_BIN/llvm-objdump" \
            READELF="$YUKI_BIN/llvm-readelf" STRIP="$YUKI_BIN/llvm-strip" \
            custom_defconfig

          CONFIG_FILE="out/.config"

          ./scripts/config --file "$CONFIG_FILE" --set-str CONFIG_CMDLINE "console=ttynull stack_depot_disable=on kvm-arm.mode=protected bootconfig noirqdebug nosoftlockup nmi_watchdog=0 quiet kasan.page_alloc.sample=0 kasan.stacktrace=off kasan=off slub_debug=- page_owner=off debug_guardpage_minorder=0"
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_CMDLINE_EXTEND

          # Zamanlayıcı ve güç
          ./scripts/config --file "$CONFIG_FILE" --module CONFIG_SCHED_WALT
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_SCHED_CLUSTER
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_SCHED_SMT
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_HZ_100
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_HZ_250
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_HZ_300
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_HZ_500
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_HZ_1000
          ./scripts/config --file "$CONFIG_FILE" --set-val CONFIG_HZ 300
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_NO_HZ_IDLE
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_NO_HZ_FULL
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_THERMAL_GOV_STEP_WISE
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_THERMAL_GOV_POWER_ALLOCATOR
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_THERMAL_DEFAULT_GOV_STEP_WISE
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_THERMAL_DEFAULT_GOV_POWER_ALLOCATOR

          # ThinLTO
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_ARCH_SUPPORTS_LTO_CLANG
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_ARCH_SUPPORTS_LTO_CLANG_THIN
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_HAS_LTO_CLANG
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_LTO
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_LTO_CLANG
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_LTO_NONE
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_LTO_CLANG_FULL
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_LTO_CLANG_THIN
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_PREEMPT_NONE
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_PREEMPT_VOLUNTARY
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_PREEMPT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_PREEMPT_COUNT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_PREEMPTION
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_PREEMPT_BUILD

          # Gizlilik, ağ ve debug
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_WIREGUARD
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_IP_NF_TARGET_TTL
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_IP6_NF_TARGET_HL
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_IP6_NF_MATCH_HL
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_TMPFS_POSIX_ACL
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_TMPFS_XATTR
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_NUMA_BALANCING
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_REDUCED
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_COMPRESSED
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_SPLIT
          ##./scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_DEBUG_INFO_DWARF5

          # KernelSU ve SUSFS
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_KSU_SUSFS_SUS_MAP

          # Localversion
          ./scripts/config --file "$CONFIG_FILE" --set-str CONFIG_LOCALVERSION "-galadriel"
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_LOCALVERSION_AUTO
          sed -i 's/check_defconfig//' build.config.gki || true

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$YUKI_BIN/clang" LD="$YUKI_BIN/ld.lld" \
            HOSTCC="$YUKI_BIN/clang" HOSTCXX="$YUKI_BIN/clang++" HOSTLD="$YUKI_BIN/ld.lld" \
            AR="$YUKI_BIN/llvm-ar" NM="$YUKI_BIN/llvm-nm" \
            OBJCOPY="$YUKI_BIN/llvm-objcopy" OBJDUMP="$YUKI_BIN/llvm-objdump" \
            READELF="$YUKI_BIN/llvm-readelf" STRIP="$YUKI_BIN/llvm-strip" \
            olddefconfig

      - name: 10. Kernel derleme (Yuki Clang 24)
        run: |
          cd common
          export PATH="$YUKI_BIN:$PATH"

          echo "🔍 Kernel derlemesinde kullanılacak Clang:"
          "$YUKI_BIN/clang" --version

          BUILD_START=$(date +%s)

          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$YUKI_BIN/clang" LD="$YUKI_BIN/ld.lld" \
            HOSTCC="$YUKI_BIN/clang" HOSTCXX="$YUKI_BIN/clang++" HOSTLD="$YUKI_BIN/ld.lld" \
            AR="$YUKI_BIN/llvm-ar" NM="$YUKI_BIN/llvm-nm" \
            OBJCOPY="$YUKI_BIN/llvm-objcopy" OBJDUMP="$YUKI_BIN/llvm-objdump" \
            READELF="$YUKI_BIN/llvm-readelf" STRIP="$YUKI_BIN/llvm-strip" \
            KCFLAGS="-O2 \
            -march=armv9.2-a+crypto+crc+dotprod+rcpc+lse+sha3 \
            -falign-functions=32 \
            -fomit-frame-pointer \
            -ffunction-sections \
            -fdata-sections \
            -fno-stack-protector \
            -fno-unwind-tables \
            -fno-asynchronous-unwind-tables \
            -fno-math-errno \
            -fno-semantic-interposition \
            -Wno-frame-larger-than \
            -Wno-unused-command-line-argument \
            -Wno-error \
            -Wno-format \
            -Wno-format-extra-args \
            -Wno-constant-logical-operand \
            -Wno-unused-variable \
            -Wno-address-of-packed-member" \
            KLDFLAGS="-Wl,--gc-sections \
            -Wl,--as-needed \
            -Wl,--strip-debug \
            -Wl,--icf=safe \
            -Wl,--no-warnings \
            -Wl,-O2" \
            Image modules || {
              echo "❌ Image/modules derleme hatası!"
              exit 1
            }

          IMAGE_TIME=$(($(date +%s) - BUILD_START))
          echo "✅ Derleme süresi: $((IMAGE_TIME / 60)) dakika $((IMAGE_TIME % 60)) saniye"
          echo "BOOTHASH=Nimrodel-$(date +%s%N | cut -c1-10)" >> "$GITHUB_ENV"

      - name: 11. AnyKernel3 paketleme
        run: |
          cd ./AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=CG+ Galadriel Kernel/' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' anykernel.sh
          sed -i '/is_slot_device=auto/a device.name1=houji\ndevice.name2=shennong\ndevice.name3=aurora\ndevice.name4=xiaomi14' anykernel.sh

          cp ../common/out/arch/arm64/boot/Image .
          zip -r "../CG-Galadriel.zip" ./*
          echo "📦 Paket boyutu: $(du -h ../CG-Galadriel.zip | cut -f1)"

      - name: 12. Release yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BOOTHASH }}
          name: "CG+ Galadriel (Yuki Clang 24)"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
